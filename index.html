<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ | Professional Invoicing</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --accent: #3b82f6; 
            --accent-dark: #2563eb;
            --bg: #f8fafc; 
            --dark: #0f172a; 
            --yellow: #facc15; 
            --white: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen { 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%);
            padding: 20px;
        }

        .login-card {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-card h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; color: var(--dark); }
        .login-card p { color: #64748b; margin-bottom: 32px; font-size: 14px; }

        /* --- DASHBOARD LAYOUT --- */
        #main-dashboard { display: none; }
        
        .nav-header {
            background: var(--dark);
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card { 
            background: var(--white); 
            padding: 24px; 
            border-radius: 16px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        .section-title { 
            font-weight: 700; 
            font-size: 13px; 
            text-transform: uppercase; 
            color: #64748b; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- INPUTS --- */
        input, select { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 14px; 
            transition: all 0.2s;
            margin-bottom: 12px;
            background: #fcfcfd;
        }

        input:focus { 
            border-color: var(--accent); 
            outline: none; 
            background: #fff; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* --- BUTTONS --- */
        .btn-auth-primary { 
            background: var(--accent); 
            color: white; 
            padding: 14px 28px; 
            border-radius: 12px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
        }

        .btn-main { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            width: 100%; 
            padding: 16px; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-pdf { background: var(--dark); }
        .btn-mail { background: var(--accent); }
        .btn-upgrade { background: #10b981; }

        .leistung-zeile { 
            display: grid; 
            grid-template-columns: 1fr 80px 100px 100px 40px; 
            gap: 10px; 
            margin-bottom: 10px; 
            align-items: center; 
        }

        .badge { 
            padding: 6px 14px; 
            border-radius: 99px; 
            font-weight: 700; 
            font-size: 12px; 
        }

        .history-item { 
            background: var(--bg); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 13px; 
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
        }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div style="font-size: 40px; margin-bottom: 10px;">⚡</div>
            <h1>MEISTER-BLITZ</h1>
            <p>Ihre Rechnungen. Automatisch. Blitzschnell.</p>
            <input type="email" id="email" placeholder="E-Mail Adresse">
            <input type="password" id="password" placeholder="Passwort">
            <button class="btn-auth-primary" onclick="handleLogin()" style="margin-top: 10px;">Anmelden</button>
            <p onclick="handleSignUp()" style="margin-top:20px; cursor:pointer; text-decoration:underline;">Noch kein Konto? Registrieren</p>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="nav-header">
            <div style="font-weight: 800; font-size: 20px; letter-spacing: -1px;">⚡ MEISTER-BLITZ</div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="user-display" style="font-size: 13px; opacity: 0.8;"></span>
                <button onclick="handleLogout()" style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px;">Abmelden</button>
            </div>
        </div>

        <div class="main-container">
            <div class="sidebar">
                <div class="card">
                    <div class="section-title">Abonnement & Status</div>
                    <div id="status-display" class="badge">Lade...</div>
                    <div id="upgrade-area" style="margin-top: 20px; display: none;">
                        <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="btn-main btn-upgrade">Upgrade auf PRO (4 Wochen frei)</a>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">Meine Firmendaten</div>
                    <input type="text" id="meinName" placeholder="Firmenname" oninput="saveProfile()">
                    <input type="text" id="meinInhaber" placeholder="Inhaber" oninput="saveProfile()">
                    <input type="text" id="meinStrasse" placeholder="Straße" oninput="saveProfile()">
                    <input type="text" id="meinOrt" placeholder="PLZ / Ort" oninput="saveProfile()">
                    <input type="text" id="meinIban" placeholder="IBAN" oninput="saveProfile()">
                    <input type="text" id="meinSteuer" placeholder="Steuernummer" oninput="saveProfile()">
                    <input type="text" id="meinTel" placeholder="Telefon" oninput="saveProfile()">
                </div>

                <div class="card">
                    <div class="section-title">Letzte Rechnungen</div>
                    <div id="history-list">Keine Einträge.</div>
                </div>
            </div>

            <div class="content">
                <div class="card">
                    <div class="section-title">Dokumenten-Typ & Nummer</div>
                    <select id="doc-type">
                        <option value="RECHNUNG">Rechnung</option>
                        <option value="QUITTUNG">Quittung</option>
                        <option value="KOSTENVORANSCHLAG">Kostenvoranschlag</option>
                        <option value="LIEFERSCHEIN">Lieferschein</option>
                    </select>
                    <input type="text" id="r_nr_custom" placeholder="Nummer (z.B. RE-2024-001)">
                </div>

                <div class="card">
                    <div class="section-title">Rechnungsempfänger</div>
                    <input type="text" id="kundeName" placeholder="Name des Kunden">
                    <input type="text" id="kundeStrasse" placeholder="Straße">
                    <input type="text" id="kundeOrt" placeholder="PLZ / Ort">
                    <input type="email" id="kundeEmail" placeholder="E-Mail für Direktversand">
                </div>

                <div class="card">
                    <div class="section-title">Positionen & Leistungen</div>
                    <div id="leistungen-container"></div>
                    <button onclick="addLeistung()" style="background: none; border: 2px dashed var(--border); width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; color: #64748b; font-weight: 600;">+ Zeile hinzufügen</button>
                </div>

                <div id="action-area" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

<script>
    // Supabase Konfiguration
    const _supabase = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
    let currentUser, userCredits = 0, aboBis = null;

    window.onload = async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) { 
            currentUser = session.user; 
            await loadUserData(); 
            await checkPaymentSuccess(); 
            loadHistory(); 
        }
        id('r_nr_custom').value = "RE-" + new Date().getFullYear() + "-" + (Math.floor(Math.random() * 9000) + 1000);
    };

    async function handleLogin() {
        const { error } = await _supabase.auth.signInWithPassword({ email: v('email'), password: v('password') });
        if (error) alert("Login fehlgeschlagen."); else location.reload();
    }

    async function handleSignUp() {
        const email = v('email'), password = v('password');
        const { data, error } = await _supabase.auth.signUp({ email, password });
        if (error) { alert(error.message); } 
        else if (data.user) {
            // WICHTIG: Hier werden die 3 Gratis-Credits initial in die DB geschrieben
            await _supabase.from('profiles').insert({ id: data.user.id, credits: 3 });
            alert("Konto erstellt! Bitte einloggen.");
        }
    }

    async function handleLogout() { await _supabase.auth.signOut(); location.reload(); }

    async function loadUserData() {
        const { data: prof } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        if (prof) {
            // Wir nehmen die Credits IMMER aus der Datenbank
            userCredits = prof.credits; 
            aboBis = prof.abo_bis;
            id('meinName').value = prof.firma_name || ''; id('meinInhaber').value = prof.firma_inhaber || '';
            id('meinStrasse').value = prof.firma_strasse || ''; id('meinOrt').value = prof.firma_ort || '';
            id('meinIban').value = prof.firma_iban || ''; id('meinSteuer').value = prof.firma_steuer || '';
            id('meinTel').value = prof.firma_tel || '';
        }
        id('login-screen').style.display = 'none'; id('main-dashboard').style.display = 'block';
        id('user-display').innerText = currentUser.email;
        refreshUI();
        if(document.querySelectorAll('.leistung-zeile').length === 0) addLeistung();
    }

    async function saveProfile() {
        if (!currentUser) return;
        await _supabase.from('profiles').upsert({ 
            id: currentUser.id, 
            firma_name: v('meinName'), firma_inhaber: v('meinInhaber'),
            firma_strasse: v('meinStrasse'), firma_ort: v('meinOrt'),
            firma_iban: v('meinIban'), firma_steuer: v('meinSteuer'),
            firma_tel: v('meinTel')
            // Credits werden hier NICHT gespeichert, damit der User sie nicht selbst im Browser manipulieren kann
        });
    }

    function addLeistung() {
        const div = document.createElement('div');
        div.className = 'leistung-zeile';
        div.innerHTML = `
            <input type="text" class="desc" placeholder="Beschreibung...">
            <input type="number" class="menge" value="1">
            <select class="einheit">
                <option>Std</option><option>Stk</option><option>m</option><option>m²</option><option>m³</option><option>Lfm</option><option>Anfahrt</option><option>Pauschale</option>
            </select>
            <input type="number" class="preis" placeholder="0.00">
            <button onclick="this.parentElement.remove()" style="border:none; background:none; cursor:pointer;">✕</button>
        `;
        id('leistungen-container').appendChild(div);
    }

    function refreshUI() {
        const area = id('action-area'), status = id('status-display'), upgrade = id('upgrade-area');
        const aktiv = aboBis && new Date(aboBis) > new Date();
        
        if (aktiv) {
            status.innerText = "PRO PLAN AKTIV (UNLIMITIERT)";
            status.style.background = "#dcfce7"; status.style.color = "#166534";
            upgrade.style.display = "none";
        } else {
            status.innerText = "GUTHABEN: " + (userCredits > 0 ? userCredits : 0) + " DOKUMENTE";
            status.style.background = "#fef9c3"; status.style.color = "#854d0e";
            if(userCredits <= 0) upgrade.style.display = "block";
        }

        if (aktiv || userCredits > 0) {
            area.innerHTML = `
                <button class="btn-main btn-pdf" onclick="generatePDF(false)">PDF Dokument erstellen</button>
                <button class="btn-main btn-mail" onclick="generatePDF(true)">Per E-Mail an Kunden senden</button>`;
        } else {
            area.innerHTML = `<p style="text-align:center; color:red; font-weight:bold;">Bitte Upgrade durchführen, um weitere Dokumente zu erstellen.</p>`;
        }
    }

    async function generatePDF(isEmail) {
        const aktiv = aboBis && new Date(aboBis) > new Date();
        
        // Prüfung vor dem Erstellen
        if (!aktiv) { 
            if(userCredits <= 0) return alert("Guthaben aufgebraucht!");
            
            // WICHTIG: Credit in der Datenbank abziehen
            userCredits--; 
            const { error } = await _supabase.from('profiles').update({ credits: userCredits }).eq('id', currentUser.id);
            if(error) return alert("Fehler beim Abbuchen der Credits.");
        }
        
        refreshUI();

        const doc = new jspdf.jsPDF();
        const type = id('doc-type').value;
        const nr = v('r_nr_custom');
        
        // PDF Gestaltung (Absender oben rechts, Empfänger links)
        doc.setFontSize(10);
        doc.text(v('meinName'), 140, 20);
        doc.text(v('meinStrasse'), 140, 25);
        doc.text(v('meinOrt'), 140, 30);
        doc.text("Tel: " + v('meinTel'), 140, 35);

        doc.setFontSize(22); doc.text(type, 20, 50);
        doc.setFontSize(11);
        doc.text("AN:", 20, 65);
        doc.text(v('kundeName'), 20, 72);
        doc.text(v('kundeStrasse'), 20, 77);
        doc.text(v('kundeOrt'), 20, 82);
        
        doc.setFontSize(10);
        doc.text("Datum: " + new Date().toLocaleDateString(), 20, 100);
        doc.text("Dokument-Nr: " + nr, 20, 105);

        const tableData = []; let netto = 0;
        document.querySelectorAll('.leistung-zeile').forEach(row => {
            const d = row.querySelector('.desc').value, m = row.querySelector('.menge').value, e = row.querySelector('.einheit').value, p = row.querySelector('.preis').value;
            const s = (m * p); netto += s;
            tableData.push([d, m + " " + e, p.toFixed(2) + " €", s.toFixed(2) + " €"]);
        });

        doc.autoTable({ startY: 115, head: [['Leistung', 'Menge', 'E-Preis', 'Gesamt']], body: tableData, headStyles: {fillColor: [15, 23, 42]} });
        
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.text("Netto-Betrag:", 130, finalY); doc.text(netto.toFixed(2) + " €", 185, finalY, {align: 'right'});
        doc.text("MwSt 19%:", 130, finalY + 7); doc.text((netto * 0.19).toFixed(2) + " €", 185, finalY + 7, {align: 'right'});
        doc.setFont(undefined, 'bold');
        doc.text("RECHNUNGSBETRAG:", 130, finalY + 16); doc.text((netto * 1.19).toFixed(2) + " €", 185, finalY + 16, {align: 'right'});
        
        doc.setFont(undefined, 'normal'); doc.setFontSize(9);
        doc.text("Zahlbar an IBAN: " + v('meinIban'), 20, finalY + 35);
        doc.text("Steuer-Nr: " + v('meinSteuer') + " | Inhaber: " + v('meinInhaber'), 20, finalY + 40);

        if (isEmail) {
            const mail = v('kundeEmail');
            if(!mail) alert("Keine E-Mail Adresse des Kunden eingegeben!");
            const subject = encodeURIComponent(type + " " + nr);
            const body = encodeURIComponent("Sehr geehrte(r) " + v('kundeName') + ",\n\nanbei erhalten Sie das Dokument " + nr + " als PDF.\n\nBeste Grüße,\n" + v('meinName'));
            window.location.href = `mailto:${mail}?subject=${subject}&body=${body}`;
        }
        doc.save(`${type}_${nr}.pdf`);
        saveToHistory(v('kundeName'), (netto * 1.19).toFixed(2));
    }

    function saveToHistory(name, betrag) {
        let history = JSON.parse(localStorage.getItem('meister_history') || '[]');
        history.unshift({ name, betrag, date: new Date().toLocaleDateString() });
        localStorage.setItem('meister_history', JSON.stringify(history.slice(0,5)));
        loadHistory();
    }

    function loadHistory() {
        const list = id('history-list');
        let history = JSON.parse(localStorage.getItem('meister_history') || '[]');
        list.innerHTML = history.map(h => `<div class="history-item"><b>${h.name}</b><br>${h.betrag}€ (${h.date})</div>`).join('');
    }

    function id(i) { return document.getElementById(i); }
    function v(i) { return id(i).value; }
    
    async function checkPaymentSuccess() {
        if (new URLSearchParams(window.location.search).get('payment') === 'success') {
            let d = new Date(); d.setDate(d.getDate() + 30); 
            aboBis = d.toISOString();
            // Updatet das Abo-Datum in der Datenbank
            await _supabase.from('profiles').update({ abo_bis: aboBis }).eq('id', currentUser.id);
            window.history.replaceState({}, '', '/'); 
            refreshUI();
        }
    }
</script>
</body>
</html>
