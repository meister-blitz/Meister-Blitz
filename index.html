<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ APEX v100.0 | BUSINESS OS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --p-brand: #4f46e5; 
            --p-gold: #f59e0b;
            --p-bg: #f8fafc; 
            --p-card: #ffffff;
            --p-border: #e2e8f0;
            --p-txt: #0f172a;
            --p-radius: 24px;
            --p-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--p-bg); color: var(--p-txt); font-size: 14px; }

        /* --- NAVIGATION --- */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--p-border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
        }
        .sys-logo { font-weight: 900; font-size: 22px; display: flex; align-items: center; gap: 15px; color: var(--p-brand); }
        
        .logo-terminal {
            width: 160px; height: 50px; border: 2px dashed var(--p-border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            overflow: hidden; background: #fff; transition: 0.3s;
        }
        .logo-terminal:hover { border-color: var(--p-brand); background: #fdfdfd; }
        .logo-terminal img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .logo-terminal span { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        .btn-upgrade-gold { 
            background: var(--p-gold); color: #000; padding: 12px 24px; border-radius: 14px; 
            text-decoration: none; font-weight: 800; font-size: 13px; box-shadow: 0 4px 0 #b45309;
            transition: 0.2s;
        }

        /* --- LAYOUT ARCHITECTURE --- */
        #apex-monolith { display: none; max-width: 1100px; margin: 0 auto; padding: 110px 20px 60px; }
        .apex-section { background: var(--p-card); border-radius: var(--p-radius); padding: 40px; border: 1px solid var(--p-border); margin-bottom: 30px; box-shadow: var(--p-shadow); }
        .apex-label { font-size: 11px; font-weight: 900; color: var(--p-brand); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .apex-label::after { content: ""; height: 1px; flex: 1; background: var(--p-border); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input { width: 100%; padding: 14px; border: 1px solid var(--p-border); border-radius: 12px; font-size: 15px; font-weight: 600; background: #fdfdfd; margin-bottom: 12px; outline: none; }
        input:focus { border-color: var(--p-brand); background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08); }

        /* --- SMART SELECTION --- */
        .template-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .t-btn { background: #f1f5f9; border: 1px solid var(--p-border); padding: 10px 18px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .t-btn:hover { background: var(--p-brand); color: white; }

        /* --- POSITIONS --- */
        .pos-row { display: grid; grid-template-columns: 3fr 80px 80px 100px 40px; gap: 12px; margin-bottom: 10px; align-items: center; }
        .pos-head { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }

        .btn-core { padding: 20px; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
        .bg-dark { background: #0f172a; }
        .bg-brand { background: var(--p-brand); }

        #gate { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="gate">
        <div style="background:#fff; padding:50px; border-radius:32px; width:400px; text-align:center;">
            <h1 style="font-weight:900; font-size:32px; margin-bottom:10px;">APEX TITAN</h1>
            <p style="color:#64748b; font-weight:700; font-size:12px; margin-bottom:40px;">MEISTER-BLITZ OPERATING SYSTEM</p>
            <input type="email" id="id-mail" placeholder="E-Mail">
            <input type="password" id="id-key" placeholder="Security Key">
            <button onclick="APEX.auth()" class="btn-core bg-brand">SYSTEM INITIALISIEREN</button>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:25px;">
            <div class="logo-terminal" onclick="document.getElementById('l-input').click()">
                <span id="l-prompt">Firma Logo</span>
                <img id="l-preview" class="hidden">
            </div>
            <input type="file" id="l-input" class="hidden" accept="image/*">
            <div class="sys-logo">⚡ MEISTER-BLITZ</div>
        </div>
        <div style="display:flex; align-items:center; gap:30px;">
            <div id="lic-info" style="font-weight:800; font-size:12px; color:#10b981;">...</div>
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="btn-upgrade-gold">UPGRADE (11,99€)</a>
        </div>
    </header>

    <div id="apex-monolith">
        
        <div class="grid-2">
            <div class="apex-section">
                <span class="apex-label">01. Firmendaten (Sync)</span>
                <input type="text" id="m-fn" placeholder="Firmenname" oninput="APEX.sync()">
                <div class="grid-2">
                    <input type="text" id="m-str" placeholder="Straße" oninput="APEX.sync()">
                    <input type="text" id="m-ort" placeholder="Ort" oninput="APEX.sync()">
                </div>
                <input type="text" id="m-iban" placeholder="IBAN" oninput="APEX.sync()">
            </div>
            <div class="apex-section">
                <span class="apex-label">02. Debitor (Kunde)</span>
                <input type="text" id="c-nm" placeholder="Name / Firma">
                <div class="grid-2">
                    <input type="text" id="c-st" placeholder="Straße">
                    <input type="text" id="c-ot" placeholder="Ort">
                </div>
                <input type="email" id="c-ml" placeholder="Kunden E-Mail">
            </div>
        </div>

        <div class="apex-section">
            <span class="apex-label">03. Leistungs-Terminal</span>
            <div class="template-bar">
                <button class="t-btn" onclick="UI.add('Facharbeit Elektro', 1, 69, 'Std.')">⚡ Arbeit</button>
                <button class="t-btn" onclick="UI.add('Anfahrt Zone 1', 1, 35, 'Psch.')">🚗 Anfahrt</button>
                <button class="t-btn" onclick="UI.add('Kleinmaterial Pauschale', 1, 15, 'Psch.')">📦 Material</button>
                <button class="t-btn" onclick="UI.add('Notdienst-Zuschlag', 1, 85, 'Std.')">🚨 Notdienst</button>
                <button class="t-btn" onclick="UI.add('DGUV Prüfung', 1, 45, 'Stk.')">📋 Prüfung</button>
                <button class="t-btn" onclick="UI.add('E-Check Wohnung', 1, 159, 'Psch.')">🛡️ E-Check</button>
            </div>
            <div class="pos-head">
                <div class="pos-row"><span>Leistung</span><span>Menge</span><span>Einheit</span><span>Preis</span><span></span></div>
            </div>
            <div id="pos-root"></div>
            <button onclick="UI.add('',1,0,'Std.')" style="width:100%; padding:15px; border:2px dashed var(--p-border); background:none; border-radius:12px; font-weight:800; color:#94a3b8; cursor:pointer; margin-top:15px;">+ Eigene Position</button>
        </div>

        <div class="grid-2">
            <button class="btn-core bg-dark" onclick="APEX.generate(false)">📥 PDF ARCHIVIEREN</button>
            <button class="btn-core bg-brand" onclick="APEX.generate(true)">✉️ BELEG VERSENDEN</button>
        </div>

        <div class="apex-section" style="margin-top:40px;">
            <span class="apex-label">04. Journal</span>
            <div id="journal-root" style="text-align:center; color:#94a3b8; font-weight:700;">Noch keine Belege erstellt.</div>
        </div>
    </div>

    <script>
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
        
        const APEX = {
            user: null, creds: 3, logo: null, timer: null,
            async auth() {
                const e = document.getElementById('id-mail').value, p = document.getElementById('id-key').value;
                const {data, error} = await _DB.auth.signInWithPassword({email:e, password:p});
                if(error) await _DB.auth.signUp({email:e, password:p});
                location.reload();
            },
            async init() {
                const {data:{session}} = await _DB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('gate').classList.add('hidden');
                    document.getElementById('apex-monolith').style.display = 'block';
                    const {data:p} = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) { this.creds = p.credits ?? 3; this.fill(p); }
                    UI.add('Arbeitsleistung', 1, 0, 'Std.'); UI.upd();
                }
            },
            fill(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-str').value = p.firma_strasse || '';
                document.getElementById('m-ort').value = p.firma_ort || '';
                document.getElementById('m-iban').value = p.firma_iban || '';
            },
            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id, firma_name: document.getElementById('m-fn').value,
                        firma_strasse: document.getElementById('m-str').value,
                        firma_ort: document.getElementById('m-ort').value,
                        firma_iban: document.getElementById('m-iban').value
                    });
                }, 1000);
            },
            async generate(send) {
                if(this.creds <= 0) return alert("Kontingent erschöpft!");
                const doc = new jspdf.jsPDF();
                if(this.logo) doc.addImage(this.logo, 'PNG', 150, 10, 45, 25);
                doc.setFontSize(26).setFont(undefined, 'bold').text("RECHNUNG", 20, 30);
                doc.setFontSize(10).setFont(undefined, 'normal');
                doc.text(`${document.getElementById('m-fn').value}\n${document.getElementById('m-str').value}\n${document.getElementById('m-ort').value}`, 20, 40);
                doc.text(`KUNDE:\n${document.getElementById('c-nm').value}\n${document.getElementById('c-st').value}\n${document.getElementById('c-ot').value}`, 20, 65);
                const rows = []; let sum = 0;
                document.querySelectorAll('.pos-data').forEach(r => {
                    const d = r.querySelector('.p-d').value, q = r.querySelector('.p-q').value, e = r.querySelector('.p-e').value, p = r.querySelector('.p-p').value;
                    sum += (q*p); rows.push([d, q, e, p + " €", (q*p).toFixed(2) + " €"]);
                });
                doc.autoTable({startY: 95, head:[['Leistung', 'Menge', 'Einh.', 'Einzel', 'Gesamt']], body: rows, theme:'grid', headStyles:{fillColor:[79,70,229]}});
                doc.text(`GESAMTBETRAG INKL. MWST: ${(sum*1.19).toFixed(2)} €`, 190, doc.lastAutoTable.finalY + 15, {align:'right'});
                doc.save("Apex_Rechnung.pdf");
                if(send) window.location.href = `mailto:${document.getElementById('c-ml').value}?subject=Ihre Rechnung`;
                this.creds--;
                await _DB.from('profiles').update({credits:this.creds}).eq('id', this.user.id);
                UI.upd(); confetti();
            }
        };

        const UI = {
            add(txt, q, p, unit) {
                const div = document.createElement('div'); div.className = 'pos-row pos-data';
                div.innerHTML = `<input type="text" class="p-d" value="${txt}" placeholder="Leistung..."><input type="number" class="p-q" value="${q}"><input type="text" class="p-e" value="${unit}"><input type="number" class="p-p" value="${p}"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:#ef4444;font-weight:bold;cursor:pointer;font-size:18px;">✕</button>`;
                document.getElementById('pos-root').appendChild(div);
            },
            upd() { 
                const s = document.getElementById('lic-info');
                s.innerText = APEX.creds > 0 ? APEX.creds + " BELEGE FREI" : "LIMIT!";
                s.style.color = APEX.creds > 0 ? "#10b981" : "#ef4444";
            }
        };

        document.getElementById('l-input').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => {
                APEX.logo = ev.target.result;
                document.getElementById('l-preview').src = APEX.logo;
                document.getElementById('l-preview').classList.remove('hidden');
                document.getElementById('l-prompt').classList.add('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };
        APEX.init();
    </script>
</body>
</html>
