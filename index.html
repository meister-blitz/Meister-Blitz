<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ | Professional Terminal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --p-navy: #0f172a; --p-blue: #2563eb; --p-bg: #f8fafc; 
            --p-border: #e2e8f0; --p-accent: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--p-bg); color: var(--p-navy); min-height: 100vh; }

        /* AUTH GATEWAY */
        #gate { 
            position: fixed; inset: 0; background: var(--p-navy); z-index: 2000; 
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card { 
            background: white; padding: 50px; border-radius: 32px; width: 420px; 
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* HEADER NAVIGATION */
        header { 
            background: white; height: 90px; padding: 0 50px; display: flex; 
            align-items: center; justify-content: space-between; border-bottom: 1px solid var(--p-border);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand { font-weight: 800; font-size: 24px; letter-spacing: -1px; display: flex; align-items: center; gap: 10px; }
        .nav-actions { display: flex; align-items: center; gap: 20px; }

        /* TERMINAL WORKSPACE */
        main { max-width: 1300px; margin: 40px auto; padding: 0 40px; display: none; }
        .grid { display: grid; grid-template-columns: 1fr 400px; gap: 30px; }

        .card { 
            background: white; padding: 35px; border-radius: 24px; 
            border: 1px solid var(--p-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            margin-bottom: 30px;
        }
        .card-h { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; }

        /* INPUTS */
        input { 
            width: 100%; padding: 16px; border: 1.5px solid var(--p-border); border-radius: 12px; 
            font-size: 15px; margin-bottom: 15px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--p-blue); background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* BUTTONS */
        .btn { 
            padding: 16px 24px; border-radius: 12px; font-weight: 700; border: none; 
            cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-primary { background: var(--p-blue); color: white; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1.5px solid var(--p-border); color: var(--p-accent); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-logout { font-size: 13px; color: #ef4444; border: 1px solid #fee2e2; background: #fef2f2; padding: 8px 16px; }

        /* POSITIONS TABLE */
        .pos-row { display: grid; grid-template-columns: 3fr 80px 100px 120px 40px; gap: 15px; margin-bottom: 10px; }
        
        .badge { padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 800; }
        .badge-pro { background: #fef3c7; color: #92400e; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="auth-card">
            <h2 style="margin-bottom: 30px; font-weight: 900;">MEISTER-BLITZ</h2>
            <input type="email" id="a-mail" placeholder="E-Mail Adresse">
            <input type="password" id="a-pass" placeholder="Passwort">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <button class="btn btn-primary" onclick="CORE.auth('login')">Einloggen</button>
                <button class="btn btn-outline" onclick="CORE.auth('reg')">Registrieren</button>
            </div>
        </div>
    </div>

    <header>
        <div class="brand">⚡ MEISTER-BLITZ</div>
        <div class="nav-actions">
            <div id="status" class="badge">3 GRATIS-BELEGE</div>
            <button class="btn btn-primary" style="padding: 10px 20px; font-size: 13px;" onclick="window.open('https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200')">PRO VERSION (11,99€)</button>
            <button class="btn btn-logout" onclick="CORE.logout()">Abmelden</button>
        </div>
    </header>

    <main id="app">
        <div class="grid">
            <div class="left">
                <div class="card">
                    <div class="card-h">Absenderdaten (Automatisch gespeichert)</div>
                    <input type="text" id="m-firma" placeholder="Firmenname" oninput="CORE.sync()">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" id="m-str" placeholder="Straße / Nr." oninput="CORE.sync()">
                        <input type="text" id="m-ort" placeholder="PLZ / Ort" oninput="CORE.sync()">
                    </div>
                    <input type="text" id="m-iban" placeholder="Deine IBAN" oninput="CORE.sync()">
                </div>

                <div class="card">
                    <div class="card-h">Leistungen</div>
                    <div id="pos-area"></div>
                    <button class="btn btn-outline" style="width: 100%; border-style: dashed;" onclick="UI.add('Neue Leistung', 1, 0, 'Std.')">+ Zeile hinzufügen</button>
                </div>
            </div>

            <div class="right">
                <div class="card" style="position: sticky; top: 120px;">
                    <div class="card-h">Kunde & Summe</div>
                    <input type="text" id="c-name" placeholder="Kundenname">
                    <input type="text" id="c-addr" placeholder="Anschrift">
                    
                    <div style="margin: 30px 0; border-top: 1px solid var(--p-border); padding-top: 20px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; color: #64748b;">
                            <span>Netto:</span><span id="sum-net">0,00 €</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 24px; font-weight: 800;">
                            <span>Gesamt:</span><span id="sum-total">0,00 €</span>
                        </div>
                    </div>

                    <button class="btn btn-primary" style="width: 100%;" onclick="CORE.genPDF()">PDF JETZT ERSTELLEN</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const _SB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');

        const CORE = {
            user: null, credits: 3, pro: false, timer: null,

            async auth(type) {
                const e = document.getElementById('a-mail').value, p = document.getElementById('a-pass').value;
                const { data, error } = type === 'login' ? 
                    await _SB.auth.signInWithPassword({email: e, password: p}) : 
                    await _SB.auth.signUp({email: e, password: p});
                if(error) alert(error.message); else location.reload();
            },

            async init() {
                const { data: { session } } = await _SB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    
                    const { data: p } = await _SB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) {
                        this.credits = p.credits ?? 3;
                        this.pro = p.is_pro ?? false;
                        this.load(p);
                    }
                    UI.add('Dienstleistung', 1, 65, 'Std.');
                    this.updateUI();
                }
            },

            load(p) {
                document.getElementById('m-firma').value = p.firma_name || '';
                document.getElementById('m-str').value = p.firma_strasse || '';
                document.getElementById('m-ort').value = p.firma_ort || '';
                document.getElementById('m-iban').value = p.firma_iban || '';
            },

            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _SB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-firma').value,
                        firma_strasse: document.getElementById('m-str').value,
                        firma_ort: document.getElementById('m-ort').value,
                        firma_iban: document.getElementById('m-iban').value
                    });
                }, 1000);
            },

            updateUI() {
                const s = document.getElementById('status');
                if(this.pro) {
                    s.innerText = "PRO ACCOUNT"; s.className = "badge badge-pro";
                } else {
                    s.innerText = `${this.credits} GRATIS-BELEGE`;
                }
                UI.calc();
            },

            async genPDF() {
                if(!this.pro && this.credits <= 0) return alert("Limit erreicht!");
                const doc = new jspdf.jsPDF();
                doc.setFontSize(22).text("RECHNUNG", 20, 30);
                doc.setFontSize(10).text(document.getElementById('m-firma').value, 20, 45);
                
                const rows = [];
                document.querySelectorAll('.p-row-item').forEach(r => {
                    const q = r.querySelector('.p-q').value, p = r.querySelector('.p-p').value;
                    rows.push([r.querySelector('.p-d').value, q, r.querySelector('.p-u').value, p + " €"]);
                });

                doc.autoTable({ startY: 70, head: [['Beschreibung', 'Menge', 'Einh.', 'Preis']], body: rows });
                doc.text("Gesamt Brutto: " + document.getElementById('sum-total').innerText, 20, doc.lastAutoTable.finalY + 20);
                
                doc.save("MeisterBlitz_Rechnung.pdf");

                if(!this.pro) {
                    this.credits--;
                    await _SB.from('profiles').update({credits: this.credits}).eq('id', this.user.id);
                }
                this.updateUI();
                confetti();
            },

            logout() { _SB.auth.signOut(); location.reload(); }
        };

        const UI = {
            add(d, q, p, u) {
                const div = document.createElement('div');
                div.className = 'pos-row p-row-item';
                div.innerHTML = `
                    <input type="text" class="p-d" value="${d}">
                    <input type="number" class="p-q" value="${q}" oninput="UI.calc()">
                    <input type="text" class="p-u" value="${u}">
                    <input type="number" class="p-p" value="${p}" oninput="UI.calc()">
                    <button onclick="this.parentElement.remove(); UI.calc()" style="border:none;background:none;color:red;cursor:pointer;font-weight:bold;">✕</button>
                `;
                document.getElementById('pos-area').appendChild(div);
                this.calc();
            },
            calc() {
                let n = 0;
                document.querySelectorAll('.p-row-item').forEach(r => { n += (r.querySelector('.p-q').value * r.querySelector('.p-p').value); });
                document.getElementById('sum-net').innerText = n.toFixed(2) + " €";
                document.getElementById('sum-total').innerText = (n * 1.19).toFixed(2) + " €";
            }
        };

        CORE.init();
    </script>
</body>
</html>
