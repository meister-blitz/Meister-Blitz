<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ v4.0 | PRO-SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* DEIN DESIGN */
        :root { --primary: #5d5fef; --dark: #1a1a2e; --yellow: #ffcc00; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: auto; max-width: 800px; }
        #login-screen { background: var(--yellow); padding: 60px; border-radius: 40px; text-align: center; border: 10px solid var(--dark); max-width: 450px; margin-top: 50px; }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; border: 4px solid #000; border-radius: 12px; font-weight: bold; box-sizing: border-box; }
        .btn-black { background: #000; color: #fff; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        #dashboard { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h1>⚡ MEISTER-BLITZ</h1>
        <input type="email" id="email" class="auth-input" placeholder="E-MAIL">
        <input type="password" id="pw" class="auth-input" placeholder="PASSWORT">
        <button class="btn-black" onclick="auth('signInWithPassword')">ANMELDEN</button>
        <button class="btn-black" style="background:#555; margin-top:10px;" onclick="auth('signUp')">REGISTRIEREN</button>
    </div>

    <div id="dashboard">
        <div class="card" style="background:var(--dark); color:white; display:flex; justify-content:space-between; margin-bottom:20px;">
            <span id="user-mail"></span>
            <span id="credit-info" style="color:var(--yellow); font-weight:bold;">Credits: -</span>
        </div>

        <div class="card">
            <h3>🏢 FIRMEN-PROFIL</h3>
            <div class="grid">
                <input type="text" id="meinName" placeholder="Firmenname" oninput="save()">
                <input type="text" id="meinIban" placeholder="IBAN" oninput="save()">
                <input type="text" id="meinSteuer" placeholder="Steuernummer" oninput="save()">
                <input type="text" id="meinStrasse" placeholder="Straße" oninput="save()">
                <input type="text" id="meinOrt" placeholder="PLZ / Ort" oninput="save()">
            </div>
            <button onclick="pdf()" style="width:100%; padding:20px; background:var(--primary); color:white; border:none; border-radius:15px; font-weight:bold; margin-top:20px; cursor:pointer;">📥 PDF ERSTELLEN</button>
        </div>
        <button onclick="logout()" style="width:100%; margin-top:20px; background:none; border:none; color:red; cursor:pointer;">Abmelden</button>
    </div>

<script>
    const URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    const _sb = supabase.createClient(URL, KEY);

    async function auth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('pw').value;
        const { data, error } = await _sb.auth[type]({ email, password });
        if(error) return alert("Fehler: " + error.message);
        if(type === 'signUp') alert("Registriert! Jetzt anmelden.");
        else start(data.user);
    }

    async function start(user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('user-mail').innerText = user.email;

        const { data } = await _sb.from('profiles').select('*').eq('id', user.id).single();
        if(data) {
            document.getElementById('credit-info').innerText = "Credits: " + data.credits;
            document.getElementById('meinName').value = data.firma_name || '';
            document.getElementById('meinIban').value = data.firma_iban || '';
            document.getElementById('meinSteuer').value = data.firma_steuer || '';
            document.getElementById('meinStrasse').value = data.firma_strasse || '';
            document.getElementById('meinOrt').value = data.firma_ort || '';
        }
    }

    async function save() {
        const { data: { session } } = await _sb.auth.getSession();
        if(!session) return;
        await _sb.from('profiles').upsert({
            id: session.user.id,
            firma_name: document.getElementById('meinName').value,
            firma_iban: document.getElementById('meinIban').value,
            firma_steuer: document.getElementById('meinSteuer').value,
            firma_strasse: document.getElementById('meinStrasse').value,
            firma_ort: document.getElementById('meinOrt').value
        });
    }

    async function pdf() {
        const { error } = await _sb.rpc('use_credit_safe');
        if(error) return alert("Fehler: " + error.message);
        const doc = new jspdf.jsPDF();
        doc.text("RECHNUNG", 20, 20);
        doc.text("Von: " + document.getElementById('meinName').value, 20, 40);
        doc.save("Rechnung.pdf");
        location.reload();
    }

    function logout() { _sb.auth.signOut(); location.reload(); }
</script>
</body>
</html>
