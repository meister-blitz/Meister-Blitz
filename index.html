<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --yellow: #ffcc00; --dark: #111; }
        body { font-family: 'Arial Black', sans-serif; background: #eee; padding: 10px; }
        .card { background: white; padding: 25px; border-radius: 30px; border: 8px solid var(--dark); max-width: 600px; margin: 20px auto; box-shadow: 10px 10px 0 #ccc; }
        #login-screen { background: var(--yellow); text-align: center; }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; border: 4px solid var(--dark); border-radius: 12px; font-size: 18px; box-sizing: border-box; }
        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 18px; margin-top: 10px; }
        #dashboard { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h1 style="font-size: 40px; margin: 0;">⚡ MEISTER-BLITZ</h1>
        <p>HANDWERKER-PROFI-RECHNUNG</p>
        <input type="email" id="email" class="auth-input" placeholder="E-MAIL">
        <input type="password" id="pw" class="auth-input" placeholder="PASSWORT">
        <button class="btn" onclick="auth('signInWithPassword')">EINLOGGEN</button>
        <button class="btn" style="background:#555;" onclick="auth('signUp')">REGISTRIEREN</button>
    </div>

    <div id="dashboard" class="card">
        <div style="background:var(--yellow); padding: 10px; border-radius: 10px; margin-bottom: 20px; border: 3px solid var(--dark); display: flex; justify-content: space-between;">
            <b id="user-info">...</b>
            <b id="credit-info">Guthaben: -</b>
        </div>

        <h3>🏢 MEINE FIRMENDATEN</h3>
        <div class="grid">
            <input type="text" id="fName" placeholder="Firma" oninput="save()">
            <input type="text" id="fIban" placeholder="IBAN" oninput="save()">
            <input type="text" id="fSteuer" placeholder="Steuernr." oninput="save()">
            <input type="text" id="fStrasse" placeholder="Strasse" oninput="save()">
            <input type="text" id="fOrt" placeholder="PLZ / Ort" oninput="save()">
        </div>

        <h3 style="margin-top:20px;">👤 KUNDE</h3>
        <input type="text" id="kName" placeholder="Name des Kunden">

        <button class="btn" style="background:var(--yellow); color:black; border:4px solid var(--dark); margin-top:30px;" onclick="pdf()">📥 RECHNUNG ERSTELLEN</button>
        <button onclick="logout()" style="width:100%; margin-top:20px; background:none; border:none; color:red; cursor:pointer;">ABMELDEN</button>
    </div>

<script>
    const URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    const _supabase = supabase.createClient(URL, KEY);

    let credits = 0;

    async function auth(method) {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw').value;
        if(!email || !pw) return alert("Bitte E-Mail und Passwort eingeben!");

        const { data, error } = await _supabase.auth[method]({ email, password: pw });
        
        if(error) return alert("LOGIN-FEHLER: " + error.message);
        
        if(method === 'signUp') {
            await _supabase.from('profiles').insert([{ id: data.user.id, credits: 3 }]);
            alert("Konto erstellt! Bitte logge dich jetzt ein.");
        } else {
            loadApp(data.user);
        }
    }

    async function loadApp(user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('user-info').innerText = user.email;

        const { data, error } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
        
        if(data) {
            credits = data.credits;
            document.getElementById('credit-info').innerText = "Guthaben: " + credits;
            document.getElementById('fName').value = data.firma_name || '';
            document.getElementById('fIban').value = data.firma_iban || '';
            document.getElementById('fSteuer').value = data.firma_steuer || '';
            document.getElementById('fStrasse').value = data.firma_strasse || '';
            document.getElementById('fOrt').value = data.firma_ort || '';
        }
    }

    async function save() {
        const { data: { session } } = await _supabase.auth.getSession();
        if(!session) return;

        const { error } = await _supabase.from('profiles').upsert({
            id: session.user.id,
            firma_name: document.getElementById('fName').value,
            firma_iban: document.getElementById('fIban').value,
            firma_steuer: document.getElementById('fSteuer').value,
            firma_strasse: document.getElementById('fStrasse').value,
            firma_ort: document.getElementById('fOrt').value
        });
        if(error) console.log("Speicherfehler:", error.message);
    }

    async function pdf() {
        if(credits <= 0) return alert("Kein Guthaben mehr!");
        
        const { error } = await _supabase.rpc('use_credit_safe');
        if(error) return alert("Fehler beim Credit-Abzug: " + error.message);

        const doc = new jspdf.jsPDF();
        doc.text("RECHNUNG", 20, 20);
        doc.text("Kunde: " + document.getElementById('kName').value, 20, 40);
        doc.save("Rechnung.pdf");
        location.reload();
    }

    function logout() {
        _supabase.auth.signOut();
        location.reload();
    }
</script>
</body>
</html>
