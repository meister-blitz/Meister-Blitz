<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ | Professional Terminal v15</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --p-navy: #0f172a; --p-blue: #2563eb; --p-bg: #f8fafc; 
            --p-border: #e2e8f0; --p-text: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--p-bg); color: var(--p-navy); min-height: 100vh; }

        /* AUTH & HEADER */
        #gate { position: fixed; inset: 0; background: var(--p-navy); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 50px; border-radius: 32px; width: 420px; text-align: center; }
        
        header { background: white; height: 90px; padding: 0 50px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--p-border); position: sticky; top: 0; z-index: 1000; }
        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* MAIN */
        main { max-width: 1400px; margin: 40px auto; padding: 0 40px; display: none; }
        .grid { display: grid; grid-template-columns: 1fr 420px; gap: 40px; }

        .card { background: white; padding: 35px; border-radius: 24px; border: 1px solid var(--p-border); margin-bottom: 30px; }
        .label { font-size: 11px; font-weight: 800; color: var(--p-blue); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; display: block; }

        /* KLICKBARE ELEMENTE */
        .selector-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .chip { 
            flex: 1; padding: 12px; border: 2px solid var(--p-border); border-radius: 12px; 
            text-align: center; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; 
        }
        .chip.active { border-color: var(--p-blue); background: #eff6ff; color: var(--p-blue); }

        input { width: 100%; padding: 15px; border: 1.5px solid #f1f5f9; border-radius: 12px; font-size: 15px; font-weight: 600; margin-bottom: 15px; outline: none; background: #fafafa; }
        input:focus { border-color: var(--p-blue); background: #fff; }

        /* POSITIONS */
        .pos-row { display: grid; grid-template-columns: 3fr 80px 100px 120px 40px; gap: 15px; margin-bottom: 10px; align-items: center; }
        
        .summary-card { background: var(--p-navy); color: white; padding: 35px; border-radius: 28px; position: sticky; top: 120px; }
        .sum-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; color: #94a3b8; }
        .btn-gen { width: 100%; padding: 20px; background: var(--p-blue); color: white; border: none; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 25px; }

        .badge { padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 800; background: #dcfce7; color: #166534; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="auth-card">
            <h2 style="font-weight:900; margin-bottom:30px;">MEISTER-BLITZ</h2>
            <input type="email" id="a-mail" placeholder="E-Mail">
            <input type="password" id="a-pass" placeholder="Passwort">
            <button class="btn-gen" onclick="CORE.auth('login')" style="margin-top:10px;">Login / Register</button>
        </div>
    </div>

    <header>
        <div style="font-weight:900; font-size:24px;">⚡ MEISTER-BLITZ</div>
        <div class="nav-right">
            <div id="status" class="badge">3 GRATIS CREDITS</div>
            <button onclick="CORE.logout()" style="background:none; border:none; color:red; font-weight:700; cursor:pointer;">Logout</button>
        </div>
    </header>

    <main id="app">
        <div class="grid">
            <div class="left">
                <div class="card">
                    <span class="label">Dokumenten-Typ wählen</span>
                    <div class="selector-group">
                        <div class="chip active" onclick="UI.setType('RECHNUNG', this)">Rechnung</div>
                        <div class="chip" onclick="UI.setType('QUITTUNG', this)">Quittung</div>
                        <div class="chip" onclick="UI.setType('ANGEBOT', this)">Angebot</div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div>
                            <label style="font-size:11px; font-weight:700; color:#94a3b8;">Beleg-Nummer</label>
                            <input type="text" id="doc-num" placeholder="z.B. 2024-001">
                        </div>
                        <div>
                            <label style="font-size:11px; font-weight:700; color:#94a3b8;">Datum</label>
                            <input type="date" id="doc-date">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <span class="label">Meine Firmendaten</span>
                    <input type="text" id="m-name" placeholder="Firmenname" oninput="CORE.sync()">
                    <input type="text" id="m-iban" placeholder="IBAN für Zahlungen" oninput="CORE.sync()">
                </div>

                <div class="card">
                    <span class="label">Leistungspositionen</span>
                    <div id="pos-root"></div>
                    <button onclick="UI.addRow()" style="width:100%; padding:15px; border:2px dashed var(--p-border); background:none; border-radius:12px; cursor:pointer; font-weight:700; color:#94a3b8;">+ Zeile hinzufügen</button>
                </div>
            </div>

            <div class="right">
                <div class="summary-card">
                    <span class="label" style="color:#94a3b8;">Kalkulation</span>
                    
                    <label style="font-size:11px; font-weight:700; color:#94a3b8; display:block; margin-bottom:10px;">MwSt. Satz wählen</label>
                    <div class="selector-group">
                        <div class="chip active" onclick="UI.setTax(19, this)">19%</div>
                        <div class="chip" onclick="UI.setTax(7, this)">7%</div>
                        <div class="chip" onclick="UI.setTax(0, this)">0%</div>
                    </div>

                    <input type="text" id="c-name" placeholder="Kundenname" style="background:#1e293b; border:none; color:white; margin-top:20px;">
                    
                    <div style="margin-top:30px; border-top:1px solid #334155; padding-top:20px;">
                        <div class="sum-line"><span>Netto:</span><span id="v-net">0,00 €</span></div>
                        <div class="sum-line"><span>MwSt (<span id="tax-label">19</span>%):</span><span id="v-tax">0,00 €</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:26px; font-weight:800; margin-top:15px;">
                            <span>Gesamt:</span><span id="v-total">0,00 €</span>
                        </div>
                    </div>

                    <button class="btn-gen" onclick="CORE.export()">PDF HERUNTERLADEN</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const _SB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');

        const CORE = {
            user: null, creds: 3, tax: 19, type: 'RECHNUNG', timer: null,

            async auth(mode) {
                const e = document.getElementById('a-mail').value, p = document.getElementById('a-pass').value;
                const {data, error} = await _SB.auth.signInWithPassword({email:e, password:p});
                if(error) {
                    const {data:regData, error:regErr} = await _SB.auth.signUp({email:e, password:p});
                    if(regErr) alert(regErr.message); else alert("Account erstellt! Logge dich jetzt ein.");
                } else { location.reload(); }
            },

            async init() {
                const {data:{session}} = await _SB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    const {data:p} = await _SB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) { this.creds = p.credits ?? 3; this.fill(p); }
                    document.getElementById('doc-date').valueAsDate = new Date();
                    document.getElementById('doc-num').value = 'MB-' + Date.now().toString().slice(-6);
                    UI.addRow();
                    this.upd();
                }
            },

            fill(p) {
                document.getElementById('m-name').value = p.firma_name || '';
                document.getElementById('m-iban').value = p.firma_iban || '';
            },

            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _SB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-name').value,
                        firma_iban: document.getElementById('m-iban').value
                    });
                }, 1000);
            },

            upd() {
                document.getElementById('status').innerText = `${this.creds} CREDITS VERFÜGBAR`;
                UI.calc();
            },

            async export() {
                if(this.creds <= 0) return alert("Credits leer!");
                const doc = new jspdf.jsPDF();
                doc.setFontSize(22).setFont(undefined, 'bold').text(this.type, 20, 30);
                doc.setFontSize(10).setFont(undefined, 'normal').text(`Nr: ${document.getElementById('doc-num').value} | Datum: ${document.getElementById('doc-date').value}`, 20, 38);
                doc.text(`VON: ${document.getElementById('m-name').value}`, 20, 55);
                doc.text(`AN: ${document.getElementById('c-name').value}`, 20, 65);

                const rows = [];
                document.querySelectorAll('.p-row').forEach(r => {
                    const q = r.querySelector('.p-q').value, p = r.querySelector('.p-p').value;
                    rows.push([r.querySelector('.p-d').value, q, p + " €", (q*p).toFixed(2) + " €"]);
                });

                doc.autoTable({ startY: 75, head: [['Leistung', 'Menge', 'Preis', 'Gesamt']], body: rows });
                doc.text(`Gesamtbetrag: ${document.getElementById('v-total').innerText}`, 190, doc.lastAutoTable.finalY + 15, {align:'right'});
                doc.text(`Zahlbar an IBAN: ${document.getElementById('m-iban').value}`, 20, doc.lastAutoTable.finalY + 25);

                doc.save(`${this.type}_${document.getElementById('doc-num').value}.pdf`);
                this.creds--;
                await _SB.from('profiles').update({credits: this.creds}).eq('id', this.user.id);
                this.upd(); confetti();
            },

            logout() { _SB.auth.signOut(); location.reload(); }
        };

        const UI = {
            addRow() {
                const div = document.createElement('div');
                div.className = 'pos-row';
                div.innerHTML = `<input type="text" class="p-d" placeholder="Leistung..."><input type="number" class="p-q" value="1" oninput="UI.calc()"><input type="text" value="Std."><input type="number" class="p-p" value="0" oninput="UI.calc()"><button onclick="this.parentElement.remove(); UI.calc()" style="border:none;background:none;color:red;font-weight:bold;">✕</button>`;
                document.getElementById('pos-root').appendChild(div);
            },
            setType(t, el) {
                CORE.type = t;
                document.querySelectorAll('.selector-group:first-child .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            },
            setTax(v, el) {
                CORE.tax = v;
                document.getElementById('tax-label').innerText = v;
                document.querySelectorAll('.summary-card .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                this.calc();
            },
            calc() {
                let n = 0;
                document.querySelectorAll('.pos-row').forEach(r => { n += (r.querySelector('.p-q').value * r.querySelector('.p-p').value); });
                const taxVal = n * (CORE.tax / 100);
                document.getElementById('v-net').innerText = n.toFixed(2) + " €";
                document.getElementById('v-tax').innerText = taxVal.toFixed(2) + " €";
                document.getElementById('v-total').innerText = (n + taxVal).toFixed(2) + " €";
            }
        };

        CORE.init();
    </script>
</body>
</html>
