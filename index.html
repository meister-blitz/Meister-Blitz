<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ v4.0 | PRO-SYSTEM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* DEIN GELIEBTES GELBES DESIGN */
        :root { --primary: #5d5fef; --secondary: #28a745; --bg: #f0f4f8; --dark: #1a1a2e; --yellow: #ffcc00; --white: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; color: #333; line-height: 1.6; }
        .wrapper { width: 100%; max-width: 1000px; }
        .card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e0e6ed; }
        
        #login-screen { 
            background: var(--yellow); padding: 80px 50px; border-radius: 40px; text-align: center; 
            border: 10px solid var(--dark); box-shadow: 0 30px 60px rgba(0,0,0,0.3); margin-top: 40px;
        }
        .auth-input { width: 100%; max-width: 400px; padding: 20px; margin: 15px 0; border-radius: 15px; border: 5px solid #000; font-size: 20px; font-weight: 900; box-sizing: border-box; outline: none; }
        .btn-auth-primary { background: #000; color: #fff; padding: 20px 50px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 20px; box-shadow: 0 5px 0 #333; }
        
        #main-dashboard { display: none; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--dark); color: white; padding: 20px 30px; border-radius: 20px; margin-bottom: 25px; }
        .section-title { font-weight: 900; color: var(--primary); margin-bottom: 20px; border-left: 5px solid var(--primary); text-transform: uppercase; font-size: 16px; padding-left: 15px; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; background: #fafafa; }
        
        .leistung-zeile { display: grid; grid-template-columns: 3fr 1fr 1fr 1.2fr 0.5fr; gap: 15px; margin-bottom: 12px; background: #f4f6ff; padding: 15px; border-radius: 15px; align-items: center; }
        .btn-main { display: flex; align-items: center; justify-content: center; width: 100%; padding: 20px; color: white; border: none; border-radius: 18px; font-size: 18px; font-weight: 900; cursor: pointer; margin-bottom: 15px; text-decoration: none; }
        .btn-pdf { background: var(--primary); }
        .btn-mail { background: var(--secondary); }
        .badge { background: #fff3cd; color: #856404; padding: 12px 25px; border-radius: 15px; font-weight: 900; border: 2px solid #ffeeba; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="login-screen">
            <h1 style="font-size: 55px; margin: 0; letter-spacing: -3px;">⚡ MEISTER-BLITZ</h1>
            <p style="font-weight: 900; text-transform: uppercase; margin-bottom: 40px;">Profi-Rechnungen in Sekunden</p>
            <input type="email" id="email" class="auth-input" placeholder="IHRE E-MAIL">
            <input type="password" id="password" class="auth-input" placeholder="PASSWORT">
            <div style="margin-top: 30px;">
                <button class="btn-auth-primary" onclick="handleLogin()">ANMELDEN</button>
                <p onclick="handleSignUp()" style="margin-top:25px; cursor:pointer; font-weight:bold; text-decoration:underline;">Noch kein Konto? Registrieren (3 Gratis-Tests)</p>
            </div>
        </div>

        <div id="main-dashboard">
            <div class="header-bar">
                <span>USER: <b id="user-display" style="color:var(--yellow);"></b></span>
                <button onclick="handleLogout()" style="background:#ff4d4d; color:white; border:none; padding:10px 20px; border-radius:12px; cursor:pointer; font-weight:800;">LOGOUT</button>
            </div>

            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin:0;">DASHBOARD</h2>
                <div id="status-display" class="badge">Prüfe...</div>
            </div>

            <div class="card">
                <div class="section-title">🏢 FIRMEN-PROFIL</div>
                <div class="grid-inputs">
                    <input type="text" id="meinName" placeholder="Firmenname">
                    <input type="text" id="meinStrasse" placeholder="Straße">
                    <input type="text" id="meinOrt" placeholder="PLZ / Ort">
                    <input type="text" id="meinIban" placeholder="IBAN">
                </div>
            </div>

            <div class="card">
                <div class="section-title">👤 KUNDE</div>
                <div class="grid-inputs">
                    <input type="text" id="kundeName" placeholder="Kundenname">
                    <input type="text" id="kundeStrasse" placeholder="Straße">
                    <input type="text" id="kundeOrt" placeholder="PLZ / Ort">
                </div>
            </div>

            <div class="card">
                <div class="section-title">🛠️ POSITIONEN</div>
                <div id="leistungen-container"></div>
                <button onclick="addLeistung()" style="width:100%; padding:15px; border:2px dashed #ccc; border-radius:15px; background:none; cursor:pointer;">+ POSITION HINZUFÜGEN</button>
            </div>

            <div id="action-area" class="card" style="border:5px solid var(--primary);">
                </div>
        </div>
    </div>

<script>
    const _supabase = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA');

    let currentUser, userProfile;

    async function handleLogin() {
        const { data, error } = await _supabase.auth.signInWithPassword({ email: v('email'), password: v('password') });
        if (error) alert(error.message); else location.reload();
    }

    async function handleSignUp() {
        const { data, error } = await _supabase.auth.signUp({ email: v('email'), password: v('password') });
        if (error) alert(error.message);
        else if (data.user) {
            await _supabase.from('profiles').insert({ id: data.user.id, credits: 3 });
            alert("Konto erstellt! Bitte einloggen.");
        }
    }

    async function handleLogout() { await _supabase.auth.signOut(); location.reload(); }

    window.onload = async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) { currentUser = session.user; loadDashboard(); }
    };

    async function loadDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        document.getElementById('user-display').innerText = currentUser.email;
        
        const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        userProfile = data;
        
        refreshUI();
        if(document.querySelectorAll('.leistung-zeile').length === 0) addLeistung('Servicepauschale', 1, 'Std', 75);
    }

    function addLeistung(d='', m=1, e='Std', p=0) {
        const div = document.createElement('div');
        div.className = 'leistung-zeile';
        div.innerHTML = `<input type="text" class="desc" value="${d}"><input type="number" class="menge" value="${m}"><select><option>Std</option><option>Stk</option></select><input type="number" class="preis" value="${p}"><button onclick="this.parentElement.remove()">❌</button>`;
        document.getElementById('leistungen-container').appendChild(div);
    }

    function refreshUI() {
        const aktiv = userProfile.abo_bis && new Date(userProfile.abo_bis) > new Date();
        const status = document.getElementById('status-display');
        const area = document.getElementById('action-area');

        status.innerText = aktiv ? "PRO UNLIMITIERT" : "GUTHABEN: " + userProfile.credits + " CODES";
        
        if (aktiv || userProfile.credits > 0) {
            area.innerHTML = `<button class="btn-main btn-pdf" onclick="generate()">📥 RECHNUNG JETZT ERSTELLEN</button>`;
        } else {
            area.innerHTML = `<p style="color:red; font-weight:900;">LIMIT ERREICHT!</p><a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="btn-main btn-secondary">🚀 4 WOCHEN FLATRATE FREISCHALTEN (11,99€)</a>`;
        }
    }

    async function generate() {
        const aktiv = userProfile.abo_bis && new Date(userProfile.abo_bis) > new Date();
        if (!aktiv) {
            const { error } = await _supabase.rpc('use_credit_safe');
            if (error) return alert("Fehler: " + error.message);
        }

        const doc = new jspdf.jsPDF();
        doc.setFontSize(30); doc.text("RECHNUNG", 20, 30);
        doc.setFontSize(12); doc.text("Von: " + v('meinName'), 20, 50);
        doc.text("An: " + v('kundeName'), 20, 70);
        doc.save("Meister-Rechnung.pdf");
        
        alert("Rechnung erstellt! -1 Credit verbraucht.");
        location.reload();
    }

    function v(id) { return document.getElementById(id).value; }
</script>
</body>
</html>
