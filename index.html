<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ v150.0 | SUPREME MONOLITH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --accent: #4f46e5; --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --dim: #64748b; --border: #e2e8f0;
            --radius: 30px; --shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }

        /* AUTH GATE */
        #auth-gate {
            position: fixed; inset: 0; z-index: 999999; background: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .gate-box {
            width: 100%; max-width: 420px; padding: 50px; background: white;
            border-radius: 40px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); z-index: 100000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
        }
        .logo { font-weight: 900; font-size: 22px; }
        .logo span { background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 10px; margin-left: 8px; }

        /* MAIN CONTENT - SINGLE COLUMN */
        #app-monolith { 
            display: none; width: 100%; max-width: 900px; margin: 0 auto; padding: 110px 20px 80px;
        }

        .card {
            background: var(--card); border-radius: var(--radius);
            padding: 40px; border: 1px solid var(--border); margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .label {
            font-size: 11px; font-weight: 900; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
        }
        .label::after { content: ""; height: 1px; flex: 1; background: var(--border); }

        /* INPUT FIELDS */
        .group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 10px; font-weight: 800; color: var(--dim); text-transform: uppercase; }
        
        .input {
            width: 100%; padding: 16px 20px; border-radius: 15px; border: 1px solid var(--border);
            background: #fcfdfe; font-size: 15px; font-weight: 600; transition: 0.2s;
            pointer-events: all !important; /* SICHERHEIT GEGEN ÜBERLAGERUNG */
        }
        .input:focus { border-color: var(--accent); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        /* POSITIONS ENGINE */
        .pos-row {
            padding: 25px; border: 1px solid var(--border); border-radius: 20px;
            margin-bottom: 15px; background: #fff; 
            display: grid; grid-template-columns: 2fr 0.6fr 0.8fr 0.8fr 50px; gap: 15px; align-items: flex-end;
        }
        .helper { margin-top: 8px; padding: 8px; border-radius: 10px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: #f8fafc; }

        /* BUTTONS */
        .btn {
            padding: 20px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main { background: var(--text); color: #fff; width: 100%; }
        .btn-accent { background: var(--accent); color: #fff; width: 100%; }
        .btn-add { background: transparent; border: 2px dashed var(--border); color: var(--dim); margin-bottom: 30px; width: 100%; }
        .btn-add:hover { border-color: var(--accent); color: var(--accent); }

        /* PAYWALL */
        #stripe-paywall {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000000; align-items: center; justify-content: center; backdrop-filter: blur(15px);
        }
        .pay-card {
            background: #fff; padding: 60px; border-radius: 40px; text-align: center; max-width: 500px;
        }

        /* LOGO */
        .logo-box {
            width: 100%; height: 120px; border: 2px dashed var(--border); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
        }
        .logo-box img { max-height: 90px; }

        .status { padding: 10px 20px; border-radius: 30px; font-weight: 800; font-size: 11px; margin-bottom: 30px; display: inline-block; }
        .st-green { background: #ecfdf5; color: #065f46; }
        .st-red { background: #fee2e2; color: #b91c1c; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="stripe-paywall">
        <div class="pay-card">
            <h2 style="font-size: 32px; margin-bottom: 15px;">Limit erreicht</h2>
            <p style="color: var(--dim); margin-bottom: 30px;">Ihre 3 Test-Belege sind aufgebraucht.</p>
            <div style="background: var(--bg); padding: 30px; border-radius: 25px; margin-bottom: 30px;">
                <p style="font-weight: 900; font-size: 48px;">11,99 €</p>
                <p style="font-size: 12px; color: var(--accent); font-weight: 800;">PRO MONAT (TITAN SUPREME)</p>
            </div>
            <button class="btn btn-accent" onclick="window.open('HIER_DEIN_STRIPE_LINK', '_blank')">Jetzt mit Stripe freischalten</button>
        </div>
    </div>

    <div id="auth-gate">
        <div class="gate-box">
            <h2 style="font-size: 28px; margin-bottom: 10px;">Meister-Blitz Login</h2>
            <p style="color: var(--dim); margin-bottom: 35px;">Handwerker ERP v150.0</p>
            <div class="field" style="margin-bottom: 20px; text-align: left;">
                <label>Email</label>
                <input type="email" id="auth-email" class="input" placeholder="name@firma.de">
            </div>
            <div class="field" style="margin-bottom: 30px; text-align: left;">
                <label>Passwort</label>
                <input type="password" id="auth-pass" class="input" placeholder="••••••••">
            </div>
            <button class="btn btn-accent" onclick="MONO.login()">Terminal starten</button>
        </div>
    </div>

    <header>
        <div class="logo">⚡ MEISTER-BLITZ <span>SUPREME</span></div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span id="user-tag" style="font-size: 12px; font-weight: 700; color: var(--dim);"></span>
            <button onclick="MONO.logout()" style="background:none; border:none; color:red; cursor:pointer; font-weight:700; font-size:12px;">LOGOUT</button>
        </div>
    </header>

    <div id="app-monolith">
        
        <div id="license-tag" class="status st-green">LIZENZ OK</div>

        <div class="card">
            <span class="label">1. Deine Firmendaten (Cloud-Sync)</span>
            <div class="group">
                <div class="field"><label>Firma</label><input type="text" id="m-fn" class="input" oninput="MONO.sync()"></div>
                <div class="field"><label>Inhaber</label><input type="text" id="m-ceo" class="input" oninput="MONO.sync()"></div>
            </div>
            <div class="group">
                <div class="field"><label>Straße</label><input type="text" id="m-str" class="input" oninput="MONO.sync()"></div>
                <div class="field"><label>PLZ / Ort</label><input type="text" id="m-ort" class="input" oninput="MONO.sync()"></div>
            </div>
            <div class="group">
                <div class="field"><label>IBAN</label><input type="text" id="m-iban" class="input" oninput="MONO.sync()"></div>
                <div class="field"><label>Steuernr.</label><input type="text" id="m-tax" class="input" oninput="MONO.sync()"></div>
            </div>
            <div class="field">
                <label>Firmenlogo</label>
                <input type="file" id="logo-in" class="hidden" accept="image/*">
                <div class="logo-box" onclick="document.getElementById('logo-in').click()">
                    <span id="logo-hint" style="font-size: 10px; font-weight: 800; color: var(--dim);">KLICKEN FÜR UPLOAD</span>
                    <img id="logo-pre" class="hidden">
                </div>
            </div>
        </div>

        <div class="card">
            <span class="label">2. Rechnungsempfänger</span>
            <div class="field" style="margin-bottom: 20px;"><label>Kunde / Firma</label><input type="text" id="c-nm" class="input"></div>
            <div class="group">
                <div class="field"><label>Straße</label><input type="text" id="c-st" class="input"></div>
                <div class="field"><label>Ort</label><input type="text" id="c-ot" class="input"></div>
            </div>
            <div class="field"><label>E-Mail</label><input type="email" id="c-ml" class="input"></div>
        </div>

        <div class="card">
            <span class="label">3. Kalkulation</span>
            <div id="pos-root"></div>
            <button class="btn btn-add" onclick="UI.addPos()">+ Position hinzufügen</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <button class="btn btn-main" onclick="MONO.gen(false)">📄 PDF Export</button>
            <button class="btn btn-accent" onclick="MONO.gen(true)">✉️ Mail senden</button>
        </div>

        <div class="card" style="margin-top: 50px;">
            <span class="label">4. Verlauf</span>
            <div id="journal-root"></div>
        </div>
    </div>

    <script>
        const SERVICES = ["Arbeitsstunde", "Meisterstunde", "Anfahrt", "Material", "Notdienst"];
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');

        const MONO = {
            user: null, creds: 3, logo: null, timer: null,

            async init() {
                const { data: { session } } = await _DB.auth.getSession();
                if (session) { this.user = session.user; this.start(); }
            },

            async login() {
                const e = document.getElementById('auth-email').value;
                const p = document.getElementById('auth-pass').value;
                const { error } = await _DB.auth.signInWithPassword({ email: e, password: p });
                if (error) return alert(error.message);
                location.reload();
            },

            async logout() { await _DB.auth.signOut(); location.reload(); },

            async start() {
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('app-monolith').style.display = 'block';
                document.getElementById('user-tag').innerText = this.user.email;

                const { data: p } = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                if (p) {
                    this.creds = p.credits ?? 3;
                    this.loadProfile(p);
                    UI.renderJournal();
                }
                UI.addPos();
                UI.updateStatus();
            },

            loadProfile(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-ceo').value = p.firma_inhaber || '';
                document.getElementById('m-str').value = p.firma_strasse || '';
                document.getElementById('m-ort').value = p.firma_ort || '';
                document.getElementById('m-iban').value = p.firma_iban || '';
                document.getElementById('m-tax').value = p.firma_steuer || '';
            },

            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-fn').value,
                        firma_inhaber: document.getElementById('m-ceo').value,
                        firma_strasse: document.getElementById('m-str').value,
                        firma_ort: document.getElementById('m-ort').value,
                        firma_iban: document.getElementById('m-iban').value,
                        firma_steuer: document.getElementById('m-tax').value
                    });
                }, 800);
            },

            async gen(mail) {
                if (this.creds <= 0) return document.getElementById('stripe-paywall').style.display = 'flex';
                
                const doc = new jspdf.jsPDF();
                const rid = "RE-" + Math.floor(Math.random()*90000 + 10000);
                if (this.logo) doc.addImage(this.logo, 'PNG', 20, 15, 40, 0);
                
                doc.setFontSize(24).setFont(undefined, 'bold').text("RECHNUNG", 20, 75);
                doc.setFontSize(10).setFont(undefined, 'normal').text(`Von: ${document.getElementById('m-fn').value}\nAn: ${document.getElementById('c-nm').value}`, 20, 90);
                doc.text(`Nr: ${rid}\nDatum: ${new Date().toLocaleDateString()}`, 190, 90, { align: 'right' });

                const items = []; let net = 0;
                document.querySelectorAll('.pos-row').forEach(r => {
                    const d = r.querySelector('.p-d').value;
                    const q = parseFloat(r.querySelector('.p-q').value) || 0;
                    const p = parseFloat(r.querySelector('.p-p').value) || 0;
                    net += (q*p);
                    items.push([d, q, p.toFixed(2)+" €", (q*p).toFixed(2)+" €"]);
                });

                doc.autoTable({ startY: 120, head: [['Leistung', 'Menge', 'Einzel', 'Gesamt']], body: items });
                const finalY = doc.lastAutoTable.finalY + 15;
                const gross = net * 1.19;
                doc.setFontSize(14).setFont(undefined, 'bold').text(`Gesamtbetrag (inkl. MwSt): ${gross.toFixed(2)} €`, 190, finalY, { align: 'right' });

                if (mail) window.location.href = `mailto:${document.getElementById('c-ml').value}?subject=Rechnung ${rid}`;
                doc.save(`${rid}.pdf`);
                
                this.creds--;
                await _DB.from('profiles').update({ credits: this.creds }).eq('id', this.user.id);
                UI.updateStatus();
                this.saveJournal(document.getElementById('c-nm').value, gross.toFixed(2));
                confetti();
            },

            saveJournal(c, v) {
                let j = JSON.parse(localStorage.getItem('journal_'+this.user.id) || '[]');
                j.unshift({ c, v, d: new Date().toLocaleDateString() });
                localStorage.setItem('journal_'+this.user.id, JSON.stringify(j.slice(0, 10)));
                UI.renderJournal();
            }
        };

        const UI = {
            addPos() {
                const row = document.createElement('div');
                row.className = 'pos-row';
                row.innerHTML = `
                    <div class="field"><label>Leistung</label>
                        <input type="text" class="input p-d">
                        <select class="helper" onchange="this.previousElementSibling.value=this.value">
                            <option value="">Wahl...</option>
                            ${SERVICES.map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Menge</label><input type="number" class="input p-q" value="1"></div>
                    <div class="field"><label>Einh.</label><input type="text" class="input" value="Std."></div>
                    <div class="field"><label>€ / Einh.</label><input type="number" class="input p-p" placeholder="0.00"></div>
                    <button style="color:red; background:none; border:none; font-weight:bold; cursor:pointer;" onclick="this.parentElement.remove()">✕</button>
                `;
                document.getElementById('pos-root').appendChild(row);
            },
            updateStatus() {
                const t = document.getElementById('license-tag');
                t.innerText = MONO.creds + " Belege verfügbar";
                t.className = MONO.creds > 0 ? "status st-green" : "status st-red";
            },
            renderJournal() {
                const j = JSON.parse(localStorage.getItem('journal_'+MONO.user.id) || '[]');
                document.getElementById('journal-root').innerHTML = j.map(i => `
                    <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #eee;">
                        <div><b>${i.c}</b><br><small>${i.d}</small></div>
                        <div style="color:var(--accent); font-weight:800;">${i.v} €</div>
                    </div>
                `).join('');
            }
        };

        document.getElementById('logo-in').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => {
                MONO.logo = ev.target.result;
                document.getElementById('logo-pre').src = MONO.logo;
                document.getElementById('logo-pre').classList.remove('hidden');
                document.getElementById('logo-hint').classList.add('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };

        MONO.init();
    </script>
</body>
</html>
