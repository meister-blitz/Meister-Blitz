<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ v4.0 | PRO-SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #5d5fef; --dark: #1a1a2e; --yellow: #ffcc00; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e0e6ed; width: 100%; max-width: 800px; }
        
        /* DEIN GELBER LOGIN */
        #login-screen { background: var(--yellow); padding: 60px 40px; border-radius: 40px; text-align: center; border: 10px solid var(--dark); margin-top: 50px; }
        .auth-input { width: 100%; max-width: 400px; padding: 15px; margin: 10px 0; border-radius: 12px; border: 4px solid #000; font-size: 18px; font-weight: bold; box-sizing: border-box; }
        .btn-black { background: #000; color: #fff; padding: 18px 40px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 400px; }
        
        #main-dashboard { display: none; width: 100%; max-width: 900px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .header-bar { background: var(--dark); color: white; padding: 15px 25px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-pdf { background: var(--primary); color: white; padding: 20px; width: 100%; border: none; border-radius: 15px; font-weight: bold; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h1 style="font-size: 45px; margin: 0;">⚡ MEISTER-BLITZ</h1>
        <p style="font-weight: 900;">HANDWERKER-SOFTWARE</p>
        <input type="email" id="email" class="auth-input" placeholder="E-Mail">
        <input type="password" id="password" class="auth-input" placeholder="Passwort">
        <br>
        <button class="btn-black" onclick="auth('signInWithPassword')">ANMELDEN</button>
        <button class="btn-black" style="background:#555; margin-top:10px; font-size: 14px;" onclick="auth('signUp')">KONTO ERSTELLEN</button>
    </div>

    <div id="main-dashboard">
        <div class="header-bar">
            <span id="user-display">...</span>
            <span id="credit-badge" style="background:var(--yellow); color:black; padding:5px 15px; border-radius:10px; font-weight:bold;">Credits: -</span>
        </div>

        <div class="card">
            <h3 style="color:var(--primary);">🏢 MEINE FIRMENDATEN</h3>
            <div class="grid-inputs">
                <input type="text" id="fName" placeholder="Firmenname" oninput="save()">
                <input type="text" id="fIban" placeholder="IBAN" oninput="save()">
                <input type="text" id="fSteuer" placeholder="Steuernummer" oninput="save()">
                <input type="text" id="fStrasse" placeholder="Straße" oninput="save()">
                <input type="text" id="fOrt" placeholder="PLZ / Ort" oninput="save()">
                <input type="text" id="fInhaber" placeholder="Inhaber" oninput="save()">
            </div>
        </div>

        <div class="card">
            <h3 style="color:var(--primary);">👤 KUNDE</h3>
            <input type="text" id="kName" placeholder="Vollständiger Name des Kunden">
        </div>

        <div class="card" style="border: 4px solid var(--primary);">
            <button class="btn-pdf" onclick="generate()">📥 RECHNUNG JETZT ERSTELLEN (-1 Credit)</button>
        </div>

        <button onclick="logout()" style="width:100%; background:none; border:none; color:gray; cursor:pointer;">Abmelden</button>
    </div>

<script>
    const URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    const _sb = supabase.createClient(URL, KEY);

    let userCredits = 0;

    async function auth(method) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await _sb.auth[method]({ email, password });
        
        if (error) return alert("Fehler: " + error.message);
        
        if (method === 'signUp') {
            await _sb.from('profiles').insert([{ id: data.user.id, credits: 3 }]);
            alert("Konto erstellt! Bitte jetzt einloggen.");
        } else {
            start(data.user);
        }
    }

    async function start(user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        document.getElementById('user-display').innerText = user.email;

        const { data } = await _sb.from('profiles').select('*').eq('id', user.id).single();
        if (data) {
            userCredits = data.credits;
            document.getElementById('credit-badge').innerText = "Credits: " + userCredits;
            document.getElementById('fName').value = data.firma_name || '';
            document.getElementById('fIban').value = data.firma_iban || '';
            document.getElementById('fSteuer').value = data.firma_steuer || '';
            document.getElementById('fStrasse').value = data.firma_strasse || '';
            document.getElementById('fOrt').value = data.firma_ort || '';
            document.getElementById('fInhaber').value = data.firma_inhaber || '';
        }
    }

    async function save() {
        const { data: { session } } = await _sb.auth.getSession();
        if (!session) return;
        await _sb.from('profiles').upsert({
            id: session.user.id,
            firma_name: document.getElementById('fName').value,
            firma_iban: document.getElementById('fIban').value,
            firma_steuer: document.getElementById('fSteuer').value,
            firma_strasse: document.getElementById('fStrasse').value,
            firma_ort: document.getElementById('fOrt').value,
            firma_inhaber: document.getElementById('fInhaber').value
        });
    }

    async function generate() {
        if (userCredits <= 0) return alert("Kein Guthaben mehr!");
        
        // Credit abziehen über die sichere Funktion
        const { error } = await _sb.rpc('use_credit_safe');
        if (error) return alert("Fehler: " + error.message);

        const doc = new jspdf.jsPDF();
        doc.setFontSize(20); doc.text("RECHNUNG", 20, 20);
        doc.setFontSize(12);
        doc.text("Absender: " + document.getElementById('fName').value, 20, 40);
        doc.text("Kunde: " + document.getElementById('kName').value, 20, 60);
        
        doc.save("MeisterBlitz_Rechnung.pdf");
        location.reload(); // Seite neu laden, um Credits zu aktualisieren
    }

    function logout() { _sb.auth.signOut(); location.reload(); }

    // Automatischer Check beim Laden
    _sb.auth.getSession().then(({data}) => { if(data.session) start(data.session.user); });
</script>
</body>
</html>
