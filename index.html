<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ COMPACT v700</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { --p-brand: #4f46e5; --p-bg: #f1f5f9; --p-border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--p-bg); font-size: 12px; padding-top: 50px; }

        /* HEADER KOMPAKT */
        header { position: fixed; top: 0; width: 100%; height: 45px; background: #fff; border-bottom: 1px solid var(--p-border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 100; }
        .logo { font-weight: 900; color: var(--p-brand); font-size: 14px; }

        /* AUTH & PAYWALL */
        #auth-layer, #pay-layer { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .modal { background: #fff; padding: 25px; border-radius: 15px; width: 100%; max-width: 380px; text-align: center; }

        /* STRIPE BUTTON - IMMER SICHTBAR WENN LIMIT ERREICHT */
        .stripe-btn { display: block; background: #6366f1; color: #fff; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 15px; font-size: 14px; box-shadow: 0 4px 10px rgba(99,102,241,0.3); }

        /* KOMPAKTES LAYOUT */
        .container { max-width: 900px; margin: 0 auto; padding: 10px; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .card { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid var(--p-border); margin-bottom: 10px; }
        .section-h { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

        input { width: 100%; padding: 8px; border: 1px solid var(--p-border); border-radius: 5px; font-size: 12px; background: #fdfdfd; outline: none; }
        input:focus { border-color: var(--p-brand); background: #fff; }

        /* POSITIONEN TABELLE */
        .pos-row { display: grid; grid-template-columns: 2fr 60px 60px 80px 30px; gap: 5px; margin-bottom: 5px; align-items: center; }
        .btn-add { width: 100%; padding: 8px; background: #fff; border: 1px dashed var(--p-brand); color: var(--p-brand); border-radius: 5px; font-weight: bold; cursor: pointer; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-go { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; font-size: 13px; }
        .bg-dark { background: #1e293b; }
        .bg-brand { background: var(--p-brand); }

        .lic-info { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 10px; background: #dcfce7; color: #166534; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ MEISTER-BLITZ</div>
        <div id="lic-box" class="lic-info">3 FREI</div>
        <button onclick="APP.logout()" style="border:none; background:none; font-size:10px; font-weight:bold; cursor:pointer;">LOGOUT</button>
    </header>

    <div id="auth-layer">
        <div class="modal">
            <h2 style="margin-bottom:15px;">Login</h2>
            <input type="email" id="a-mail" placeholder="E-Mail" style="margin-bottom:10px;">
            <input type="password" id="a-pass" placeholder="Passwort" style="margin-bottom:15px;">
            <button onclick="APP.auth()" class="btn-go bg-brand" style="width:100%">STARTEN</button>
            <p style="font-size:10px; margin-top:10px; color:#64748b;">Noch kein Konto? <a href="#" onclick="APP.signup=true;APP.auth()">Registrieren</a></p>
        </div>
    </div>

    <div id="pay-layer" class="hidden">
        <div class="modal">
            <div style="font-size:40px;">🛡️</div>
            <h2 style="margin:10px 0;">Limit erreicht</h2>
            <p>Ihre 3 Freibelege sind verbraucht.</p>
            <div style="background:#f1f5f9; padding:15px; border-radius:10px; margin:15px 0;">
                <b style="font-size:24px;">11,99 €</b><br>Titanium Flatrate (Monat)
            </div>
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="stripe-btn">JETZT BEZAHLEN</a>
            <button onclick="location.reload()" style="margin-top:10px; border:none; background:none; font-size:10px;">Abbrechen</button>
        </div>
    </div>

    <div id="main" class="container">
        
        <div class="card">
            <div class="section-h">01. Mein Profil (Auto-Save)</div>
            <div class="grid">
                <input type="text" id="m-fn" placeholder="Firma" oninput="APP.sync()">
                <input type="text" id="m-ceo" placeholder="Inhaber" oninput="APP.sync()">
            </div>
            <div class="grid">
                <input type="text" id="m-st" placeholder="Straße & Nr." oninput="APP.sync()">
                <input type="text" id="m-ot" placeholder="PLZ & Ort" oninput="APP.sync()">
            </div>
            <div class="grid">
                <input type="text" id="m-ib" placeholder="IBAN" oninput="APP.sync()">
                <input type="text" id="m-tx" placeholder="Steuer-Nr." oninput="APP.sync()">
            </div>
        </div>

        <div class="card">
            <div class="section-h">02. Kunde</div>
            <input type="text" id="c-nm" placeholder="Kunde / Firmenname" style="margin-bottom:8px;">
            <div class="grid">
                <input type="text" id="c-st" placeholder="Straße">
                <input type="text" id="c-ot" placeholder="PLZ & Ort">
                <input type="email" id="c-ml" placeholder="Kunden E-Mail">
            </div>
        </div>

        <div class="card">
            <div class="section-h">03. Leistungen</div>
            <div id="pos-list"></div>
            <button class="btn-add" onclick="UI.addPos()">+ Position</button>
        </div>

        <div class="action-btns">
            <button class="btn-go bg-dark" onclick="APP.gen(false)">📥 PDF LADEN</button>
            <button class="btn-go bg-brand" onclick="APP.gen(true)">✉️ SENDEN</button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" style="color:var(--p-brand); font-size:11px; font-weight:bold; text-decoration:none;">Upgrade auf Unlimited Titanium (11,99€)</a>
        </div>

        <div class="card" style="margin-top:20px;">
            <div class="section-h">Letzte Belege</div>
            <div id="journal" style="font-size:11px;"></div>
        </div>
    </div>

    <script>
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
        
        const APP = {
            user: null, creds: 3, timer: null, signup: false,
            async auth() {
                const e = document.getElementById('a-mail').value, p = document.getElementById('a-pass').value;
                let res = this.signup ? await _DB.auth.signUp({email:e, password:p}) : await _DB.auth.signInWithPassword({email:e, password:p});
                if(res.error) alert(res.error.message); else location.reload();
            },
            async init() {
                const {data:{session}} = await _DB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('auth-layer').style.display = 'none';
                    document.getElementById('main').style.display = 'block';
                    const {data:p} = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) { this.creds = p.credits ?? 3; this.fill(p); } 
                    else await _DB.from('profiles').upsert({id:this.user.id, credits:3});
                    UI.addPos(); UI.upd(); UI.drawJ();
                }
            },
            fill(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-ceo').value = p.firma_inhaber || '';
                document.getElementById('m-st').value = p.firma_strasse || '';
                document.getElementById('m-ot').value = p.firma_ort || '';
                document.getElementById('m-ib').value = p.firma_iban || '';
                document.getElementById('m-tx').value = p.firma_steuer || '';
            },
            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-fn').value,
                        firma_inhaber: document.getElementById('m-ceo').value,
                        firma_strasse: document.getElementById('m-st').value,
                        firma_ort: document.getElementById('m-ort').value,
                        firma_iban: document.getElementById('m-iban').value,
                        firma_steuer: document.getElementById('m-tax').value
                    });
                }, 800);
            },
            async gen(mail) {
                if(this.creds <= 0) return document.getElementById('pay-layer').classList.remove('hidden');
                const doc = new jspdf.jsPDF();
                const rid = "RE-" + Math.floor(1000 + Math.random() * 9000);
                doc.setFontSize(20).text("RECHNUNG", 15, 20);
                doc.setFontSize(10).text(document.getElementById('m-fn').value, 15, 30);
                doc.text(`An: ${document.getElementById('c-nm').value}`, 15, 50);
                const rows = []; let sum = 0;
                document.querySelectorAll('.pos-row').forEach(r => {
                    const q = r.querySelector('.p-q').value, p = r.querySelector('.p-p').value;
                    sum += (q*p); rows.push([r.querySelector('.p-d').value, q, p + " €", (q*p).toFixed(2) + " €"]);
                });
                doc.autoTable({startY: 60, head:[['Was', 'Menge', 'Preis', 'Gesamt']], body: rows});
                doc.text(`Gesamt: ${(sum*1.19).toFixed(2)} € (inkl. MwSt)`, 15, doc.lastAutoTable.finalY + 10);
                doc.save(rid+".pdf");
                if(mail) window.location.href = `mailto:${document.getElementById('c-ml').value}?subject=Rechnung`;
                this.creds--;
                await _DB.from('profiles').update({credits:this.creds}).eq('id', this.user.id);
                UI.log(document.getElementById('c-nm').value, (sum*1.19).toFixed(2));
                UI.upd(); confetti();
            },
            async logout() { await _DB.auth.signOut(); location.reload(); }
        };

        const UI = {
            addPos() {
                const div = document.createElement('div'); div.className = 'pos-row';
                div.innerHTML = `<input type="text" class="p-d" placeholder="Leistung"><input type="number" class="p-q" value="1"><input type="text" value="Std."><input type="number" class="p-p" placeholder="€"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:red;font-weight:bold;">×</button>`;
                document.getElementById('pos-list').appendChild(div);
            },
            upd() { document.getElementById('lic-box').innerText = APP.creds + " FREI"; },
            log(c,s) {
                let j = JSON.parse(localStorage.getItem('j_'+APP.user.id)||'[]');
                j.unshift({c,s,d:new Date().toLocaleDateString()});
                localStorage.setItem('j_'+APP.user.id, JSON.stringify(j.slice(0,5)));
                this.drawJ();
            },
            drawJ() {
                const j = JSON.parse(localStorage.getItem('j_'+APP.user.id)||'[]');
                document.getElementById('journal').innerHTML = j.map(i=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9;"><span>${i.c}</span><b>${i.s} €</b></div>`).join('');
            }
        };

        APP.init();
    </script>
</body>
</html>
