<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ TITANIUM APEX</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --p-brand: #4f46e5; --p-gold: #f59e0b; --p-bg: #f8fafc; 
            --p-border: #e2e8f0; --p-txt: #0f172a; --p-radius: 22px;
            --p-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--p-bg); color: var(--p-txt); font-size: 14px; }

        header { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
            height: 90px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 40px; border-bottom: 1px solid var(--p-border); position: sticky; top: 0; z-index: 1000;
        }

        .logo-box {
            width: 220px; height: 60px; border: 2px dashed var(--p-brand); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            overflow: hidden; background: #f5f3ff; transition: 0.3s;
        }
        .logo-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .logo-box span { font-size: 10px; font-weight: 800; color: var(--p-brand); text-align: center; line-height: 1.2; text-transform: uppercase; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .status-badge { background: #ecfdf5; color: #059669; padding: 10px 18px; border-radius: 14px; font-weight: 800; font-size: 11px; border: 1px solid #10b981; }
        .limit-reached { background: #fef2f2; color: #ef4444; border-color: #ef4444; }

        .btn-gold { background: var(--p-gold); color: #000; padding: 14px 24px; border-radius: 15px; text-decoration: none; font-weight: 800; font-size: 13px; box-shadow: 0 5px 0 #b45309; }
        .btn-logout { background: none; border: 1px solid var(--p-border); padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: 700; color: #94a3b8; font-size: 11px; }

        #gate { position: fixed; inset: 0; background: #0f172a; z-index: 5000; display: flex; align-items: center; justify-content: center; }
        .gate-card { background: #fff; padding: 60px; border-radius: 40px; width: 500px; text-align: center; }
        .auth-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }

        .container { max-width: 1250px; margin: 40px auto; padding: 0 30px; display: none; }
        .card { background: #fff; padding: 40px; border-radius: var(--p-radius); border: 1px solid var(--p-border); box-shadow: var(--p-shadow); margin-bottom: 30px; }
        .card-h { font-size: 11px; font-weight: 900; color: var(--p-brand); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .card-h::after { content: ""; height: 1px; flex: 1; background: var(--p-border); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        input { width: 100%; padding: 16px; border: 1px solid var(--p-border); border-radius: 14px; font-size: 15px; font-weight: 600; margin-bottom: 15px; outline: none; background: #fdfdfd; }

        /* NEUTRALE SCHNELL-AUSWAHL FÜR ALLE HANDWERKER */
        .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 30px; background: #f8fafc; padding: 25px; border-radius: 20px; border: 1px solid #edf2f7; }
        .q-btn { background: #fff; border: 1px solid var(--p-border); padding: 14px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .q-btn:hover { border-color: var(--p-brand); color: var(--p-brand); transform: translateY(-2px); }

        .pos-head { display: grid; grid-template-columns: 3fr 80px 100px 120px 40px; gap: 15px; padding: 0 15px; font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; }
        .pos-row { display: grid; grid-template-columns: 3fr 80px 100px 120px 40px; gap: 15px; margin-bottom: 12px; align-items: center; }

        .btn-main { width: 100%; padding: 22px; border: none; border-radius: 18px; font-weight: 800; font-size: 16px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; }
        .bg-dark { background: #0f172a; }
        .bg-brand { background: var(--p-brand); }
        .bg-outline { background: #fff; border: 2px solid var(--p-brand); color: var(--p-brand); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="gate-card">
            <h1 style="font-weight:900; font-size:36px; margin-bottom:10px;">Meister-Blitz</h1>
            <p style="color:#64748b; font-weight:700; font-size:11px; margin-bottom:40px;">HANDWERKER RECHNUNGS-TERMINAL</p>
            <input type="email" id="id-mail" placeholder="E-Mail Adresse">
            <input type="password" id="id-pass" placeholder="Passwort">
            <div class="auth-buttons">
                <button onclick="CORE.login()" class="btn-main bg-brand">LOGIN</button>
                <button onclick="CORE.register()" class="btn-main bg-outline">REGISTRIEREN</button>
            </div>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:35px;">
            <div class="logo-box" onclick="document.getElementById('l-file').click()">
                <span id="l-txt">LOGO KOSTENLOS EINFÜGEN<br>(OPTIONAL)</span>
                <img id="l-preview" class="hidden">
            </div>
            <input type="file" id="l-file" class="hidden" accept="image/*">
            <div style="font-weight:900; font-size:26px; color:var(--p-brand); letter-spacing:-1.5px;">⚡ MEISTER-BLITZ</div>
        </div>
        <div class="nav-right">
            <div id="status" class="status-badge">PRÜFE LIZENZ...</div>
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="btn-gold">PRO FREISCHALTEN (11,99€)</a>
            <button class="btn-logout" onclick="CORE.logout()">LOGOUT</button>
        </div>
    </header>

    <div id="app" class="container">
        <div class="grid">
            <div class="card">
                <div class="card-h">01. Absender (Eigene Firma)</div>
                <input type="text" id="m-fn" placeholder="Firmenname" oninput="CORE.sync()">
                <div class="grid"><input type="text" id="m-st" placeholder="Straße"><input type="text" id="m-ot" placeholder="Ort"></div>
                <input type="text" id="m-ib" placeholder="IBAN">
            </div>
            <div class="card">
                <div class="card-h">02. Empfänger (Kunde)</div>
                <input type="text" id="c-nm" placeholder="Kunden Name">
                <div class="grid"><input type="text" id="c-st" placeholder="Straße"><input type="text" id="c-ot" placeholder="Ort"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-h">03. Leistungen (Schnellauswahl)</div>
            <div class="quick-grid">
                <button class="q-btn" onclick="UI.add('Arbeitszeit / Dienstleistung', 1, 65, 'Std.')">🕒 Arbeitszeit</button>
                <button class="q-btn" onclick="UI.add('Anfahrtspauschale', 1, 39, 'Psch.')">🚗 Anfahrtskosten</button>
                <button class="q-btn" onclick="UI.add('Materialkosten (divers)', 1, 0, 'Psch.')">📦 Material</button>
                <button class="q-btn" onclick="UI.add('Fachberatung / Planung', 1, 80, 'Std.')">📝 Beratung</button>
                <button class="q-btn" onclick="UI.add('Maschinenmiete / Werkzeug', 1, 45, 'Tag')">🛠️ Maschinen</button>
                <button class="q-btn" onclick="UI.add('Entsorgungspauschale', 1, 25, 'Psch.')">♻️ Entsorgung</button>
            </div>

            <div class="pos-head"><span>Leistung</span><span>Menge</span><span>Einheit</span><span>Preis</span><span></span></div>
            <div id="pos-area"></div>
            <button onclick="UI.add('',1,0,'Std.')" style="width:100%; padding:18px; margin-top:20px; border:2px dashed var(--p-brand); background:#f5f3ff; color:var(--p-brand); font-weight:800; cursor:pointer; border-radius:15px;">+ MANUELLE ZEILE</button>
        </div>

        <div class="grid">
            <button class="btn-main bg-dark" onclick="CORE.generate(false)">📥 PDF DOWNLOAD</button>
            <button class="btn-main bg-brand" onclick="CORE.generate(true)">✉️ PER MAIL SENDEN</button>
        </div>
    </div>

    <script>
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
        
        const CORE = {
            user: null, creds: 3, logo: null,
            async login() {
                const e = document.getElementById('id-mail').value, p = document.getElementById('id-pass').value;
                const {data, error} = await _DB.auth.signInWithPassword({email:e, password:p});
                if(error) return alert("Fehler: " + error.message);
                location.reload();
            },
            async register() {
                const e = document.getElementById('id-mail').value, p = document.getElementById('id-pass').value;
                const {data, error} = await _DB.auth.signUp({email:e, password:p});
                if(error) return alert("Fehler: " + error.message);
                alert("Account erstellt!"); location.reload();
            },
            async logout() { await _DB.auth.signOut(); location.reload(); },
            async init() {
                const {data:{session}} = await _DB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    const {data:p} = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) { this.creds = p.credits ?? 3; this.fill(p); }
                    else { await _DB.from('profiles').upsert({id:this.user.id, credits:3}); }
                    UI.add('Dienstleistung', 1, 0, 'Std.'); UI.upd();
                }
            },
            fill(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-st').value = p.firma_strasse || '';
                document.getElementById('m-ot').value = p.firma_ort || '';
                document.getElementById('m-ib').value = p.firma_iban || '';
            },
            sync() {
                setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id, firma_name: document.getElementById('m-fn').value,
                        firma_strasse: document.getElementById('m-st').value,
                        firma_ort: document.getElementById('m-ot').value,
                        firma_iban: document.getElementById('m-ib').value
                    });
                }, 1000);
            },
            async generate(mail) {
                if(this.creds <= 0) return alert("Gratis-Limit erreicht!");
                const doc = new jspdf.jsPDF();
                if(this.logo) doc.addImage(this.logo, 'PNG', 150, 10, 40, 20);
                doc.setFontSize(22).setFont(undefined, 'bold').text("RECHNUNG", 20, 30);
                doc.setFontSize(10).setFont(undefined, 'normal').text(`${document.getElementById('m-fn').value}\n${document.getElementById('m-st').value}\n${document.getElementById('m-ot').value}`, 20, 40);
                
                const rows = []; let sum = 0;
                document.querySelectorAll('.p-row-item').forEach(r => {
                    const d = r.querySelector('.p-d').value, q = r.querySelector('.p-q').value, e = r.querySelector('.p-e').value, p = r.querySelector('.p-p').value;
                    sum += (q*p); rows.push([d, q, e, p + " €", (q*p).toFixed(2) + " €"]);
                });
                doc.autoTable({startY: 90, head:[['Leistung', 'Menge', 'Einh.', 'Preis', 'Gesamt']], body: rows});
                doc.text(`Gesamt (inkl. MwSt): ${(sum*1.19).toFixed(2)} €`, 190, doc.lastAutoTable.finalY + 10, {align:'right'});
                doc.save(`Rechnung.pdf`);
                if(mail) window.location.href = `mailto:${document.getElementById('c-ml')?.value || ''}`;
                this.creds--;
                await _DB.from('profiles').update({credits:this.creds}).eq('id', this.user.id);
                UI.upd(); confetti();
            }
        };

        const UI = {
            add(txt, q, p, unit) {
                const div = document.createElement('div'); div.className = 'pos-row p-row-item';
                div.innerHTML = `<input type="text" class="p-d" value="${txt}"><input type="number" class="p-q" value="${q}"><input type="text" class="p-e" value="${unit}"><input type="number" class="p-p" value="${p}"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:red;font-weight:bold;cursor:pointer;">✕</button>`;
                document.getElementById('pos-area').appendChild(div);
            },
            upd() { 
                const b = document.getElementById('status');
                b.innerText = CORE.creds > 0 ? `${CORE.creds} GRATIS-RECHNUNGEN` : "LIMIT ERREICHT";
                if(CORE.creds <= 0) b.classList.add('limit-reached');
            }
        };

        document.getElementById('l-file').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => {
                CORE.logo = ev.target.result;
                document.getElementById('l-preview').src = CORE.logo;
                document.getElementById('l-preview').classList.remove('hidden');
                document.getElementById('l-txt').classList.add('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };
        CORE.init();
    </script>
</body>
</html>
