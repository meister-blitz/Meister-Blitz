<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ PRO TITAN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --brand: #4f46e5; --gold: #f59e0b; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); font-size: 12px; }

        header { background: #fff; padding: 5px 20px; border-bottom: 2px solid var(--brand); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; height: 50px; }
        
        /* LOGO UPLOAD AREA */
        .logo-upload { width: 120px; height: 40px; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: #f8fafc; border-radius: 4px; }
        .logo-upload img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .upgrade-btn { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: 900; font-size: 11px; box-shadow: 0 3px 0 #b45309; }

        #main { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: none; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .card { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .card-h { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; }

        input { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
        
        /* SMART CLICK TEMPLATES */
        .templates { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .temp-btn { background: #e2e8f0; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .temp-btn:hover { background: var(--brand); color: white; }

        .pos-grid { display: grid; grid-template-columns: 3fr 60px 60px 80px 30px; gap: 5px; align-items: center; margin-bottom: 4px; }
        
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 900; cursor: pointer; color: white; margin-top: 10px; }
        .bg-dark { background: #1e293b; }
        .bg-brand { background: var(--brand); }

        #auth-layer { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div style="background:#fff; padding:30px; border-radius:12px; width:320px; text-align:center;">
            <h2 style="margin-bottom:20px">Meister-Blitz Login</h2>
            <input type="email" id="a-email" placeholder="E-Mail">
            <input type="password" id="a-pass" placeholder="Passwort">
            <button onclick="APP.auth()" class="btn-action bg-brand">TERMINAL STARTEN</button>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <div class="logo-upload" onclick="document.getElementById('l-in').click()">
                <span id="l-txt">LOGO HOCHLADEN</span>
                <img id="l-img" class="hidden">
            </div>
            <input type="file" id="l-in" style="display:none" accept="image/*">
            <span style="font-weight:900; color:var(--brand); font-size:16px;">MEISTER-BLITZ</span>
        </div>
        <div style="display:flex; align-items:center; gap:15px;">
            <span id="creds" style="font-weight:bold;">...</span>
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="upgrade-btn">UPGRADE (11,99€)</a>
        </div>
    </header>

    <div id="main">
        <div class="row">
            <div class="card">
                <div class="card-h">Meine Firmendaten (Sync)</div>
                <input type="text" id="m-fn" placeholder="Firma" oninput="APP.sync()">
                <div style="display:flex; gap:4px">
                    <input type="text" id="m-st" placeholder="Straße" oninput="APP.sync()">
                    <input type="text" id="m-ot" placeholder="PLZ / Ort" oninput="APP.sync()">
                </div>
                <input type="text" id="m-ib" placeholder="IBAN" oninput="APP.sync()">
            </div>
            <div class="card">
                <div class="card-h">Empfänger</div>
                <input type="text" id="c-nm" placeholder="Name / Firma">
                <div style="display:flex; gap:4px">
                    <input type="text" id="c-st" placeholder="Straße">
                    <input type="text" id="c-ot" placeholder="Ort">
                </div>
                <input type="email" id="c-ml" placeholder="Kunden E-Mail">
            </div>
        </div>

        <div class="card">
            <div class="card-h">Leistungen & Schnell-Auswahl</div>
            <div class="templates">
                <button class="temp-btn" onclick="UI.add('Arbeitsstunden Elektrik', 1, 65)">+ Arbeit</button>
                <button class="temp-btn" onclick="UI.add('Anfahrtspauschale', 1, 25)">+ Anfahrt</button>
                <button class="temp-btn" onclick="UI.add('Kleinmaterial & Sicherungen', 1, 15)">+ Material</button>
                <button class="temp-btn" onclick="UI.add('Notdienst-Zuschlag', 1, 80)">+ Notdienst</button>
                <button class="temp-btn" onclick="UI.add('Wartung laut Protokoll', 1, 120)">+ Wartung</button>
                <button class="temp-btn" onclick="UI.add('Messprotokoll Erstellung', 1, 45)">+ Messung</button>
                <button class="temp-btn" onclick="UI.add('Entsorgung Altmaterial', 1, 20)">+ Entsorgung</button>
            </div>
            <div id="pos-list"></div>
            <button onclick="UI.add('',1,0)" style="width:100%; padding:5px; margin-top:5px; border:1px dashed var(--brand); background:none; color:var(--brand); font-weight:bold; cursor:pointer;">+ Leere Zeile (selber schreiben)</button>
        </div>

        <div class="row" style="margin-top:10px;">
            <button class="btn-action bg-dark" onclick="APP.gen(false)">📥 PDF SPEICHERN</button>
            <button class="btn-action bg-brand" onclick="APP.gen(true)">✉️ RECHNUNG SENDEN</button>
        </div>
    </div>

    <script>
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
        
        const APP = {
            user: null, creds: 3, logo: null,
            async auth() {
                const e = document.getElementById('a-email').value, p = document.getElementById('a-pass').value;
                const {data, error} = await _DB.auth.signInWithPassword({email:e, password:p});
                if(error) await _DB.auth.signUp({email:e, password:p});
                location.reload();
            },
            async init() {
                const {data:{session}} = await _DB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('auth-layer').style.display = 'none';
                    document.getElementById('main').style.display = 'block';
                    const {data:p} = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) { this.creds = p.credits ?? 3; this.fill(p); }
                    UI.add('Arbeitsstunden', 1, 0); UI.upd();
                }
            },
            fill(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-st').value = p.firma_strasse || '';
                document.getElementById('m-ot').value = p.firma_ort || '';
                document.getElementById('m-ib').value = p.firma_iban || '';
            },
            sync() {
                setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-fn').value,
                        firma_strasse: document.getElementById('m-st').value,
                        firma_ort: document.getElementById('m-ot').value,
                        firma_iban: document.getElementById('m-ib').value
                    });
                }, 500);
            },
            async gen(mail) {
                if(this.creds <= 0) { alert("Limit erreicht!"); return; }
                const doc = new jspdf.jsPDF();
                if(this.logo) doc.addImage(this.logo, 'PNG', 150, 10, 40, 20);
                doc.setFontSize(20).text("RECHNUNG", 15, 25);
                doc.setFontSize(10).text(`${document.getElementById('m-fn').value}\n${document.getElementById('m-st').value}\n${document.getElementById('m-ot').value}`, 15, 35);
                doc.text(`An: ${document.getElementById('c-nm').value}`, 15, 60);
                const rows = []; let sum = 0;
                document.querySelectorAll('.pos-grid').forEach(r => {
                    const q = r.querySelector('.p-q').value, p = r.querySelector('.p-p').value;
                    sum += (q*p); rows.push([r.querySelector('.p-d').value, q, p + " €", (q*p).toFixed(2) + " €"]);
                });
                doc.autoTable({startY: 75, head:[['Leistung', 'Menge', 'Einzel', 'Gesamt']], body: rows});
                doc.text(`Gesamtbetrag: ${(sum*1.19).toFixed(2)} € (inkl. MwSt)`, 15, doc.lastAutoTable.finalY + 10);
                doc.save("rechnung.pdf");
                if(mail) window.location.href = `mailto:${document.getElementById('c-ml').value}?subject=Rechnung`;
                this.creds--;
                await _DB.from('profiles').update({credits:this.creds}).eq('id', this.user.id);
                UI.upd();
            }
        };

        const UI = {
            add(txt, q, p) {
                const div = document.createElement('div'); div.className = 'pos-grid';
                div.innerHTML = `<input type="text" class="p-d" value="${txt}" placeholder="Leistung..."><input type="number" class="p-q" value="${q}"><input type="text" value="Std."><input type="number" class="p-p" value="${p}" placeholder="€"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:red;font-weight:bold;cursor:pointer;">×</button>`;
                document.getElementById('pos-list').appendChild(div);
            },
            upd() { document.getElementById('creds').innerText = this.creds <= 0 ? "LIMIT!" : this.creds + " FREI"; }
        };

        document.getElementById('l-in').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => {
                APP.logo = ev.target.result;
                document.getElementById('l-img').src = APP.logo;
                document.getElementById('l-img').classList.remove('hidden');
                document.getElementById('l-txt').classList.add('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };

        APP.init();
    </script>
</body>
</html>
