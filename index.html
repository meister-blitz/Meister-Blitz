<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ v26.0 | TITAN SUPREME</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --accent: #4f46e5; 
            --bg: #f3f4f6; 
            --card: #ffffff;
            --text: #111827;
            --dim: #6b7280;
            --border: #e5e7eb;
            --radius: 20px;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

        /* --- AUTH LAYER --- */
        #auth-layer {
            position: fixed; inset: 0; z-index: 1000000; background: #ffffff;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 400px; padding: 40px; background: white;
            border-radius: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center;
        }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); z-index: 10000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
        }
        .logo-area { font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .logo-area span { background: var(--accent); color: white; padding: 4px 10px; border-radius: 8px; font-size: 10px; }
        .user-nav { display: flex; align-items: center; gap: 20px; }
        .btn-logout { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s; }
        .btn-logout:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

        /* --- LAYOUT GRID --- */
        #app-grid { 
            display: none; padding: 110px 40px 40px; max-width: 1600px; 
            margin: 0 auto; grid-template-columns: 320px 1fr 320px; gap: 30px; 
        }

        .column { display: flex; flex-direction: column; gap: 25px; }

        .card {
            background: var(--card); border-radius: var(--radius);
            padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--border);
        }

        .section-title {
            font-size: 11px; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px;
            display: block; border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }

        /* --- FORM ELEMENTS --- */
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 10px; font-weight: 800; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; }
        
        .input {
            width: 100%; padding: 14px 18px; border-radius: 12px;
            border: 1px solid var(--border); background: #f9fafb;
            font-size: 14px; font-weight: 600; transition: 0.2s;
        }
        .input:focus { border-color: var(--accent); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        /* --- POSITION ENGINE (THE FIX) --- */
        .pos-row {
            background: #fff; padding: 25px; border-radius: 18px;
            border: 1px solid var(--border); margin-bottom: 15px;
            display: grid; grid-template-columns: 2.5fr 0.8fr 1fr 1fr 50px; gap: 15px; align-items: end;
        }

        /* Hybrid Container Fix */
        .hybrid { position: relative; display: flex; flex-direction: column; }
        .hybrid select { 
            margin-top: 5px; padding: 10px; border-radius: 10px; 
            border: 1px solid var(--border); font-size: 12px; color: var(--dim);
            cursor: pointer; background: #f3f4f6;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 16px 24px; border-radius: 14px; border: none;
            font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main { background: var(--text); color: white; width: 100%; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-accent { background: var(--accent); color: white; width: 100%; }

        .btn-add { background: #f3f4f6; color: var(--dim); border: 2px dashed var(--border); margin-top: 10px; width: 100%; }
        .btn-add:hover { border-color: var(--accent); color: var(--accent); }

        .btn-del { background: #fff1f2; color: #e11d48; height: 48px; width: 48px; border-radius: 12px; }
        .btn-del:hover { background: #e11d48; color: white; }

        /* --- PAYWALL & LOGO --- */
        #paywall {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000000; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .logo-preview-box {
            width: 100%; height: 120px; border: 2px dashed var(--border);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; background: #f9fafb;
        }
        .logo-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .status-pill {
            padding: 10px; border-radius: 12px; text-align: center;
            font-weight: 800; font-size: 12px; margin-bottom: 20px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-card">
            <h2 style="font-size: 28px; letter-spacing: -1px; margin-bottom: 5px;">Meister-Blitz</h2>
            <p style="color: var(--dim); font-size: 14px; margin-bottom: 30px;">Titan Supreme Edition v26.0</p>
            <div class="field" style="text-align: left;">
                <label>E-Mail</label>
                <input type="email" id="login-email" class="input" placeholder="name@firma.de">
            </div>
            <div class="field" style="text-align: left;">
                <label>Passwort</label>
                <input type="password" id="login-pass" class="input" placeholder="••••••••">
            </div>
            <button class="btn btn-accent" onclick="CORE.login()">System starten</button>
        </div>
    </div>

    <div id="paywall">
        <div class="auth-card" style="max-width: 450px;">
            <h2 style="font-size: 32px; margin-bottom: 15px;">Limit erreicht</h2>
            <p style="color: var(--dim); margin-bottom: 25px;">Ihre 3 Freibelege sind verbraucht.</p>
            <div style="background: #f3f4f6; padding: 25px; border-radius: 20px; margin-bottom: 25px;">
                <p style="font-size: 12px; font-weight: 800; color: var(--accent);">TITAN PRO ABO</p>
                <p style="font-size: 42px; font-weight: 900;">11,99 €</p>
                <p style="font-size: 12px; color: var(--dim);">pro Monat / 4 Wochen</p>
            </div>
            <button class="btn btn-accent" onclick="alert('Stripe wird geladen...')">Jetzt abonnieren</button>
        </div>
    </div>

    <header>
        <div class="logo-area">⚡ MEISTER-BLITZ <span>SUPREME</span></div>
        <div class="user-nav">
            <span id="user-mail" style="font-size: 13px; font-weight: 700; color: var(--dim);"></span>
            <button class="btn-logout" onclick="CORE.logout()">Logout</button>
        </div>
    </header>

    <div id="app-grid">
        <div class="column">
            <div class="card">
                <span class="section-title">Betriebsdaten</span>
                <div class="field"><label>Firmenname</label><input type="text" id="m-fn" class="input" oninput="CORE.sync()"></div>
                <div class="field"><label>Inhaber</label><input type="text" id="m-ceo" class="input" oninput="CORE.sync()"></div>
                <div class="field"><label>Straße / Nr.</label><input type="text" id="m-str" class="input" oninput="CORE.sync()"></div>
                <div class="field"><label>PLZ / Ort</label><input type="text" id="m-ort" class="input" oninput="CORE.sync()"></div>
                <div class="field"><label>IBAN</label><input type="text" id="m-iban" class="input" oninput="CORE.sync()"></div>
                <div class="field"><label>USt-ID</label><input type="text" id="m-tax" class="input" oninput="CORE.sync()"></div>
            </div>

            <div class="card">
                <span class="section-title">Logo</span>
                <input type="file" id="logo-file" class="hidden" accept="image/*">
                <div class="logo-preview-box" onclick="document.getElementById('logo-file').click()">
                    <span id="logo-prompt" style="font-size: 10px; font-weight: 800; color: var(--dim);">KLICKEN ZUM HOCHLADEN</span>
                    <img id="logo-img" class="hidden">
                </div>
            </div>
        </div>

        <div class="column">
            <div id="status-info" class="status-pill">Lade Status...</div>

            <div class="card">
                <span class="section-title">Empfänger & Leistungen</span>
                <div class="field"><label>Kunde / Firma</label><input type="text" id="c-name" class="input" placeholder="Name des Kunden"></div>
                
                <div id="items-root">
                    </div>
                
                <button class="btn btn-add" onclick="UI.addRow()">+ Position hinzufügen</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0;">
                <button class="btn btn-main" style="background: #000;" onclick="CORE.generate(false)">📄 PDF Export</button>
                <button class="btn btn-main" style="background: var(--accent);" onclick="CORE.generate(true)">✉️ E-Mail Senden</button>
            </div>
        </div>

        <div class="column">
            <div class="card">
                <span class="section-title">Letzte Belege</span>
                <div id="journal-root">
                    <p style="font-size: 12px; color: var(--dim); text-align: center;">Keine Einträge.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SERVICES = [
            "Handwerker-Arbeitsleistung (Facharbeiter-Stunde)",
            "Meister-Stundenleistung (Bauleitung & Planung)",
            "Fachhelfer-Tätigkeit (Montageunterstützung)",
            "An- und Abfahrtspauschale (inkl. Rüstzeit)",
            "Materialpauschale (Kleinmaterial & Hilfsstoffe)",
            "DGUV V3 Sicherheitsprüfung",
            "Notdienst-Bereitstellung (Zuschlag)"
        ];

        const UNITS = ["Std.", "Pa.", "Stk.", "m", "m²"];

        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');

        const CORE = {
            user: null,
            credits: 0,
            logoData: null,
            timer: null,

            async init() {
                const { data: { session } } = await _DB.auth.getSession();
                if (session) {
                    this.user = session.user;
                    this.launch();
                }
            },

            async login() {
                const e = document.getElementById('login-email').value;
                const p = document.getElementById('login-pass').value;
                const { error } = await _DB.auth.signInWithPassword({ email: e, password: p });
                if (error) return alert("Fehler: " + error.message);
                location.reload();
            },

            async logout() {
                await _DB.auth.signOut();
                location.reload();
            },

            async launch() {
                document.getElementById('auth-layer').classList.add('hidden');
                document.getElementById('app-grid').style.display = 'grid';
                document.getElementById('user-mail').innerText = this.user.email;

                const { data: p } = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                if (p) {
                    this.credits = p.credits ?? 3;
                    document.getElementById('m-fn').value = p.firma_name || '';
                    document.getElementById('m-ceo').value = p.firma_inhaber || '';
                    document.getElementById('m-str').value = p.firma_strasse || '';
                    document.getElementById('m-ort').value = p.firma_ort || '';
                    document.getElementById('m-iban').value = p.firma_iban || '';
                    document.getElementById('m-tax').value = p.firma_steuer || '';
                    UI.updateStatus();
                    this.renderJournal();
                }
                UI.addRow();
            },

            sync() {
                clearTimeout(this.timer);
                this.timer = setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-fn').value,
                        firma_inhaber: document.getElementById('m-ceo').value,
                        firma_strasse: document.getElementById('m-str').value,
                        firma_ort: document.getElementById('m-ort').value,
                        firma_iban: document.getElementById('m-iban').value,
                        firma_steuer: document.getElementById('m-tax').value
                    });
                }, 1000);
            },

            async generate(isEmail) {
                if (this.credits <= 0) {
                    document.getElementById('paywall').style.display = 'flex';
                    return;
                }

                const doc = new jspdf.jsPDF();
                const rid = "RE-" + Math.floor(100000 + Math.random() * 900000);
                
                if (this.logoData) doc.addImage(this.logoData, 'PNG', 20, 15, 40, 0);
                
                doc.setFontSize(8).text(`${document.getElementById('m-fn').value} | ${document.getElementById('m-str').value} | ${document.getElementById('m-ort').value}`, 20, 60);
                doc.setFontSize(26).setFont(undefined, 'bold').text("RECHNUNG", 20, 80);
                
                doc.setFontSize(10).setFont(undefined, 'normal');
                doc.text(`Kunde: ${document.getElementById('c-name').value}`, 20, 95);
                doc.text(`Nr: ${rid}\nDatum: ${new Date().toLocaleDateString('de-DE')}`, 190, 95, { align: 'right' });

                const items = [];
                let net = 0;
                document.querySelectorAll('.pos-row').forEach(r => {
                    const desc = r.querySelector('.p-desc').value;
                    const qty = parseFloat(r.querySelector('.p-qty').value) || 0;
                    const unit = r.querySelector('.p-unit').value;
                    const price = parseFloat(r.querySelector('.p-price').value) || 0;
                    const total = qty * price;
                    net += total;
                    items.push([desc, `${qty} ${unit}`, `${price.toFixed(2)} €`, `${total.toFixed(2)} €`]);
                });

                doc.autoTable({
                    startY: 115,
                    head: [['Leistung', 'Menge', 'Einzel', 'Gesamt']],
                    body: items,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 0, 0] }
                });

                const fy = doc.lastAutoTable.finalY + 15;
                const gross = net * 1.19;

                doc.setFontSize(12).setFont(undefined, 'bold').text(`Gesamtbetrag (inkl. 19% MwSt): ${gross.toFixed(2)} €`, 190, fy, { align: 'right' });
                doc.setFontSize(8).setFont(undefined, 'normal').text(`Bankverbindung: ${document.getElementById('m-iban').value}`, 105, 285, { align: 'center' });

                if (isEmail) {
                    window.location.href = `mailto:?subject=Rechnung ${rid}&body=Anbei die Rechnung über ${gross.toFixed(2)} €`;
                }
                
                doc.save(`${rid}.pdf`);
                
                this.credits--;
                await _DB.from('profiles').update({ credits: this.credits }).eq('id', this.user.id);
                this.saveJournal(document.getElementById('c-name').value, gross.toFixed(2));
                UI.updateStatus();
                confetti({ particleCount: 100 });
            },

            saveJournal(c, v) {
                let j = JSON.parse(localStorage.getItem('j_' + this.user.id) || '[]');
                j.unshift({ c, v, d: new Date().toLocaleDateString('de-DE') });
                localStorage.setItem('j_' + this.user.id, JSON.stringify(j.slice(0, 10)));
                this.renderJournal();
            },

            renderJournal() {
                const root = document.getElementById('journal-root');
                const j = JSON.parse(localStorage.getItem('j_' + this.user.id) || '[]');
                if (j.length > 0) {
                    root.innerHTML = j.map(i => `<div style="padding:15px 0; border-bottom:1px solid #eee;">
                        <div style="font-weight:800; font-size:13px;">${i.c}</div>
                        <div style="color:var(--accent); font-weight:800;">${i.v} €</div>
                    </div>`).join('');
                }
            }
        };

        const UI = {
            addRow() {
                const root = document.getElementById('items-root');
                const div = document.createElement('div');
                div.className = 'pos-row';
                div.innerHTML = `
                    <div class="hybrid">
                        <label>Leistung</label>
                        <input type="text" class="input p-desc" placeholder="...">
                        <select onchange="this.previousElementSibling.value = this.value">
                            <option value="">Wählen...</option>
                            ${SERVICES.map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label>Menge</label>
                        <input type="number" class="input p-qty" value="1">
                    </div>
                    <div class="hybrid">
                        <label>Einh.</label>
                        <input type="text" class="input p-unit" value="Std.">
                        <select onchange="this.previousElementSibling.value = this.value">
                            ${UNITS.map(u => `<option value="${u}">${u}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label>Preis €</label>
                        <input type="number" class="input p-price" placeholder="0.00">
                    </div>
                    <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
                `;
                root.appendChild(div);
            },
            updateStatus() {
                const s = document.getElementById('status-info');
                s.innerText = CORE.credits + " Belege verfügbar";
                s.style.background = CORE.credits > 0 ? "#ecfdf5" : "#fee2e2";
                s.style.color = CORE.credits > 0 ? "#065f46" : "#b91c1c";
            }
        };

        document.getElementById('logo-file').onchange = (e) => {
            const r = new FileReader();
            r.onload = (ev) => {
                CORE.logoData = ev.target.result;
                document.getElementById('logo-img').src = CORE.logoData;
                document.getElementById('logo-img').classList.remove('hidden');
                document.getElementById('logo-prompt').classList.add('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };

        CORE.init();
    </script>
</body>
</html>
