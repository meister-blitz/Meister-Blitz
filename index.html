<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ | Titanium Business OS v10</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --p-brand: #4f46e5; --p-gold: #f59e0b; --p-bg: #f1f5f9; 
            --p-border: #e2e8f0; --p-txt: #0f172a; --p-radius: 28px;
            --p-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--p-bg); color: var(--p-txt); overflow-x: hidden; }

        /* HIGH-STABILITY HEADER */
        header { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px);
            height: 110px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 60px; border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000;
        }

        .logo-terminal {
            width: 260px; height: 75px; border: 3px dashed var(--p-brand); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: #fff; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .logo-terminal:hover { transform: scale(1.03); border-style: solid; box-shadow: 0 15px 30px rgba(79, 70, 229, 0.2); }
        .logo-terminal img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .logo-terminal span { font-size: 11px; font-weight: 800; color: var(--p-brand); text-transform: uppercase; }

        .nav-actions { display: flex; align-items: center; gap: 30px; }
        .badge-system { background: #dcfce7; color: #166534; padding: 14px 24px; border-radius: 18px; font-weight: 800; font-size: 12px; border: 2px solid #bbf7d0; box-shadow: 0 5px 15px rgba(22,101,52,0.1); }
        .badge-system.locked { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

        .btn-premium { background: var(--p-gold); color: #000; padding: 18px 32px; border-radius: 20px; text-decoration: none; font-weight: 800; font-size: 14px; box-shadow: 0 6px 0 #b45309; transition: 0.2s; }
        .btn-premium:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309; }

        /* AUTH GATEWAY */
        #auth-gate { position: fixed; inset: 0; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-panel { background: #fff; padding: 80px; border-radius: 56px; width: 550px; text-align: center; box-shadow: 0 50px 100px rgba(0,0,0,0.8); }
        .auth-input { width: 100%; padding: 22px; border: 2px solid #f1f5f9; border-radius: 20px; font-size: 16px; font-weight: 700; margin-bottom: 20px; outline: none; background: #f8fafc; }
        .auth-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }

        /* WORKSPACE */
        .workspace { max-width: 1400px; margin: 60px auto; padding: 0 50px; display: none; }
        .titan-card { background: #fff; padding: 50px; border-radius: var(--p-radius); border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--p-shadow); margin-bottom: 40px; position: relative; }
        .card-label { font-size: 12px; font-weight: 900; color: var(--p-brand); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; display: flex; align-items: center; gap: 25px; }
        .card-label::after { content: ""; height: 2px; flex: 1; background: #f1f5f9; }

        .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 35px; }
        input[type="text"], input[type="email"], input[type="number"] { 
            width: 100%; padding: 20px; border: 2px solid #f1f5f9; border-radius: 18px; font-size: 16px; font-weight: 700; margin-bottom: 20px; outline: none; transition: 0.3s; background: #fafafa;
        }
        input:focus { border-color: var(--p-brand); background: #fff; box-shadow: 0 0 0 6px rgba(79, 70, 229, 0.08); }

        /* QUICK OPTIONS (UNIVERSAL HANDWERKER) */
        .universal-shortcuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px; background: #f8fafc; padding: 35px; border-radius: 30px; }
        .s-btn { background: #fff; border: 2px solid #e2e8f0; padding: 18px; border-radius: 18px; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .s-btn:hover { border-color: var(--p-brand); color: var(--p-brand); transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.05); }

        /* POSITION TABLE */
        .pos-header { display: grid; grid-template-columns: 4fr 120px 140px 150px 60px; gap: 25px; padding: 0 25px; font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 20px; }
        .pos-item { display: grid; grid-template-columns: 4fr 120px 140px 150px 60px; gap: 25px; margin-bottom: 15px; align-items: center; }

        .btn-giant { width: 100%; padding: 28px; border: none; border-radius: 24px; font-weight: 900; font-size: 20px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 20px; transition: 0.4s; }
        .btn-black { background: #0f172a; }
        .btn-primary { background: var(--p-brand); box-shadow: 0 20px 40px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { transform: translateY(-5px); box-shadow: 0 25px 50px rgba(79, 70, 229, 0.4); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-panel">
            <h1 style="font-weight:900; font-size:48px; margin-bottom:10px; letter-spacing:-3px;">MEISTER-BLITZ</h1>
            <p style="color:#64748b; font-weight:800; font-size:13px; margin-bottom:50px; letter-spacing:3px; text-transform:uppercase;">Titanium Apex Edition v10</p>
            
            <input type="email" id="auth-email" class="auth-input" placeholder="E-Mail Adresse">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Terminal-Schlüssel (Passwort)">
            
            <div class="auth-btn-group">
                <button onclick="ENGINE.auth('login')" class="btn-giant btn-primary" style="font-size:14px;">ANMELDEN</button>
                <button onclick="ENGINE.auth('reg')" class="btn-giant" style="font-size:14px; background:#fff; border:3px solid var(--p-brand); color:var(--p-brand);">REGISTRIEREN</button>
            </div>
        </div>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:50px;">
            <div class="logo-terminal" onclick="document.getElementById('logo-upload').click()">
                <span id="logo-hint">LOGO KOSTENLOS EINFÜGEN</span>
                <img id="logo-img" class="hidden">
            </div>
            <input type="file" id="logo-upload" class="hidden" accept="image/*">
            <div style="font-weight:900; font-size:32px; color:var(--p-brand); letter-spacing:-2px;">⚡ TITANIUM</div>
        </div>
        
        <div class="nav-actions">
            <div id="license-status" class="badge-system">INITIALISIERE...</div>
            <a href="https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200" class="btn-premium">FULL ACCESS (11,99€)</a>
            <button class="btn-exit" onclick="ENGINE.exit()" style="background:none; border:none; color:#94a3b8; font-weight:800; cursor:pointer;">EXIT</button>
        </div>
    </header>

    <div id="main-os" class="workspace">
        
        <div class="field-grid">
            <div class="titan-card">
                <div class="card-label">01. Absender (Saved to Cloud)</div>
                <input type="text" id="m-fn" placeholder="Firmenname" oninput="ENGINE.debounceSync()">
                <div class="field-grid">
                    <input type="text" id="m-st" placeholder="Straße" oninput="ENGINE.debounceSync()">
                    <input type="text" id="m-ot" placeholder="PLZ / Ort" oninput="ENGINE.debounceSync()">
                </div>
                <input type="text" id="m-ib" placeholder="IBAN" oninput="ENGINE.debounceSync()">
                <input type="text" id="m-tx" placeholder="Steuernummer / USt-ID" oninput="ENGINE.debounceSync()">
            </div>

            <div class="titan-card">
                <div class="card-label">02. Rechnungsempfänger</div>
                <input type="text" id="c-nm" placeholder="Kunde / Firma Name">
                <div class="field-grid">
                    <input type="text" id="c-st" placeholder="Straße">
                    <input type="text" id="c-ot" placeholder="PLZ / Ort">
                </div>
                <input type="email" id="c-ml" placeholder="Kunden E-Mail">
            </div>
        </div>

        <div class="titan-card">
            <div class="card-label">03. Leistungs-Terminal (Universal)</div>
            
            <div class="universal-shortcuts">
                <button class="s-btn" onclick="CORE.addRow('Arbeitsleistung / Facharbeitszeit', 1, 65, 'Std.')">🕒 ARBEITSZEIT</button>
                <button class="s-btn" onclick="CORE.addRow('Anfahrtspauschale / Fahrtkosten', 1, 39, 'Psch.')">🚗 ANFAHRT</button>
                <button class="s-btn" onclick="CORE.addRow('Materialkosten / Kleinteile', 1, 0, 'Psch.')">📦 MATERIAL</button>
                <button class="s-btn" onclick="CORE.addRow('Dienstleistungspauschale', 1, 120, 'Psch.')">🛠️ PAUSCHALE</button>
                <button class="s-btn" onclick="CORE.addRow('Maschinennutzung / Miete', 1, 50, 'Tag')">⚙️ MASCHINEN</button>
            </div>

            <div class="pos-header">
                <span>Leistungsbeschreibung</span><span>Menge</span><span>Einheit</span><span>Einzelpreis</span><span></span>
            </div>
            <div id="pos-root"></div>
            
            <button onclick="CORE.addRow('',1,0,'Std.')" style="width:100%; padding:22px; margin-top:30px; border:3px dashed var(--p-brand); background:#f5f3ff; color:var(--p-brand); font-weight:900; cursor:pointer; border-radius:20px;">
                + MANUELLE POSITION HINZUFÜGEN
            </button>
        </div>

        <div class="field-grid">
            <button class="btn-giant btn-black" onclick="CORE.exportPDF(false)">📥 PDF ARCHIVIEREN</button>
            <button class="btn-giant btn-primary" onclick="CORE.exportPDF(true)">✉️ RECHNUNG SENDEN</button>
        </div>
    </div>

    <script>
        const _DB = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
        
        const ENGINE = {
            user: null, credits: 3, logo: null, syncTimer: null,

            async auth(mode) {
                const e = document.getElementById('auth-email').value;
                const p = document.getElementById('auth-pass').value;
                if(!e || !p) return alert("Sicherheitshinweis: Zugangsdaten unvollständig.");
                
                const { data, error } = mode === 'login' ? 
                    await _DB.auth.signInWithPassword({email: e, password: p}) :
                    await _DB.auth.signUp({email: e, password: p});

                if(error) alert("System-Fehler: " + error.message);
                else location.reload();
            },

            async init() {
                const { data: { session } } = await _DB.auth.getSession();
                if(session) {
                    this.user = session.user;
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('main-os').style.display = 'block';
                    
                    const { data: p } = await _DB.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
                    if(p) {
                        this.credits = p.credits ?? 3;
                        this.fillData(p);
                    } else {
                        await _DB.from('profiles').upsert({id: this.user.id, credits: 3});
                    }
                    CORE.addRow('Dienstleistung', 1, 0, 'Std.');
                    this.updateUI();
                }
            },

            fillData(p) {
                document.getElementById('m-fn').value = p.firma_name || '';
                document.getElementById('m-st').value = p.firma_strasse || '';
                document.getElementById('m-ot').value = p.firma_ort || '';
                document.getElementById('m-ib').value = p.firma_iban || '';
                document.getElementById('m-tx').value = p.firma_steuer || '';
            },

            debounceSync() {
                clearTimeout(this.syncTimer);
                this.syncTimer = setTimeout(async () => {
                    await _DB.from('profiles').upsert({
                        id: this.user.id,
                        firma_name: document.getElementById('m-fn').value,
                        firma_strasse: document.getElementById('m-st').value,
                        firma_ort: document.getElementById('m-ot').value,
                        firma_iban: document.getElementById('m-ib').value,
                        firma_steuer: document.getElementById('m-tx').value
                    });
                    console.log("Cloud Sync Completed.");
                }, 1500);
            },

            updateUI() {
                const b = document.getElementById('license-status');
                b.innerText = this.credits > 0 ? `${this.credits} GRATIS-RECHNUNGEN` : "LIMIT ERREICHT";
                if(this.credits <= 0) b.classList.add('locked');
            },

            exit() { _DB.auth.signOut(); location.reload(); }
        };

        const CORE = {
            addRow(txt, q, p, unit) {
                const div = document.createElement('div');
                div.className = 'pos-item';
                div.innerHTML = `
                    <input type="text" class="p-d" value="${txt}" placeholder="Beschreibung...">
                    <input type="number" class="p-q" value="${q}">
                    <input type="text" class="p-e" value="${unit}">
                    <input type="number" class="p-p" value="${p}">
                    <button onclick="this.parentElement.remove()" style="border:none;background:none;color:#ef4444;font-weight:900;cursor:pointer;font-size:24px;">✕</button>
                `;
                document.getElementById('pos-root').appendChild(div);
            },

            async exportPDF(sendMail) {
                if(ENGINE.credits <= 0) return alert("System-Sperre: Bitte Pro-Lizenz erwerben.");
                
                const doc = new jspdf.jsPDF();
                if(ENGINE.logo) doc.addImage(ENGINE.logo, 'PNG', 150, 10, 45, 25);
                
                doc.setFontSize(26).setFont(undefined, 'bold').text("RECHNUNG", 20, 30);
                doc.setFontSize(10).setFont(undefined, 'normal');
                doc.text(`${document.getElementById('m-fn').value}\n${document.getElementById('m-st').value}\n${document.getElementById('m-ot').value}`, 20, 42);
                doc.text(`AN EMPFÄNGER:\n${document.getElementById('c-nm').value}\n${document.getElementById('c-st').value}\n${document.getElementById('c-ot').value}`, 20, 65);
                
                const tableData = []; let subtotal = 0;
                document.querySelectorAll('.pos-item').forEach(row => {
                    const d = row.querySelector('.p-d').value;
                    const q = parseFloat(row.querySelector('.p-q').value) || 0;
                    const e = row.querySelector('.p-e').value;
                    const p = parseFloat(row.querySelector('.p-p').value) || 0;
                    const total = q * p;
                    subtotal += total;
                    tableData.push([d, q, e, p.toFixed(2) + " €", total.toFixed(2) + " €"]);
                });

                doc.autoTable({
                    startY: 95,
                    head: [['Beschreibung', 'Menge', 'Einh.', 'Einzel', 'Gesamt']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [79, 70, 229] }
                });

                const vat = subtotal * 0.19;
                const grandTotal = subtotal + vat;

                doc.setFontSize(12).setFont(undefined, 'bold');
                doc.text(`Gesamt Netto: ${subtotal.toFixed(2)} €`, 190, doc.lastAutoTable.finalY + 15, {align: 'right'});
                doc.text(`MwSt 19%: ${vat.toFixed(2)} €`, 190, doc.lastAutoTable.finalY + 22, {align: 'right'});
                doc.text(`Gesamtbetrag: ${grandTotal.toFixed(2)} €`, 190, doc.lastAutoTable.finalY + 30, {align: 'right'});
                
                doc.save(`Rechnung_${Date.now()}.pdf`);
                
                if(sendMail) {
                    const mail = document.getElementById('c-ml').value;
                    window.location.href = `mailto:${mail}?subject=Rechnung`;
                }

                ENGINE.credits--;
                await _DB.from('profiles').update({credits: ENGINE.credits}).eq('id', ENGINE.user.id);
                ENGINE.updateUI();
                confetti();
            }
        };

        document.getElementById('logo-upload').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                ENGINE.logo = ev.target.result;
                document.getElementById('logo-img').src = ENGINE.logo;
                document.getElementById('logo-img').classList.remove('hidden');
                document.getElementById('logo-hint').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        ENGINE.init();
    </script>
</body>
</html>
