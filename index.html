<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --y: #ffcc00; --d: #1a1a2e; --p: #5d5fef; }
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; max-width: 800px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .yellow-head { background: var(--y); padding: 20px; border-radius: 10px; text-align: center; border: 4px solid var(--d); }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-black { background: var(--d); color: white; }
        .btn-blue { background: var(--p); color: white; }
        .zeile { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr; gap: 10px; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="login-area" class="card" style="max-width: 400px; text-align: center;">
        <div class="yellow-head"><h1>⚡ BLITZ-LOGIN</h1></div>
        <input type="email" id="email" placeholder="E-Mail">
        <input type="password" id="pw" placeholder="Passwort">
        <button class="btn btn-black" onclick="auth('signInWithPassword')">EINLOGGEN</button>
        <button onclick="auth('signUp')" style="background:none; border:none; color:blue; cursor:pointer; margin-top:10px;">Neu registrieren (3 Credits gratis)</button>
    </div>

    <div id="app-area" style="display:none;">
        <div class="card">
            <div class="yellow-head">
                <h2 style="margin:0;">RECHNUNGS-GENERATOR</h2>
                <small id="user-mail"></small> | <b id="credit-status">Lade...</b>
            </div>
        </div>

        <div class="card">
            <h3>🏢 MEINE FIRMEN-DATEN</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="f_name" placeholder="Firmenname">
                <input type="text" id="f_str" placeholder="Straße">
                <input type="text" id="f_ort" placeholder="PLZ / Ort">
                <input type="text" id="f_iban" placeholder="IBAN">
                <input type="text" id="f_stnr" placeholder="Steuernummer">
            </div>
            <button class="btn btn-black" style="background:#28a745;" onclick="saveFirma()">DATEN SPEICHERN</button>
        </div>

        <div class="card">
            <h3>👤 KUNDE & RECHNUNG</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="k_name" placeholder="Kundenname">
                <input type="text" id="k_str" placeholder="Straße">
                <input type="text" id="k_ort" placeholder="PLZ / Ort">
                <input type="text" id="r_nr" placeholder="Rechnungsnummer">
            </div>
        </div>

        <div class="card">
            <h3>🛠️ LEISTUNGEN</h3>
            <div id="pos-list"></div>
            <button onclick="addPos()" style="width:100%; padding:10px; border:2px dashed #ccc; background:none; cursor:pointer;">+ Position hinzufügen</button>
        </div>

        <div class="card" style="border: 4px solid var(--p);">
            <button class="btn btn-blue" onclick="go('pdf')">📥 PDF SPEICHERN</button>
            <button class="btn btn-black" onclick="go('mail')">📧 AN KUNDE SENDEN</button>
        </div>
    </div>

<script>
    // DEINE SUPABASE DATEN
    const S_URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    const sb = supabase.createClient(S_URL, S_KEY);

    let user = null;
    let credits = 0;

    async function auth(mode) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('pw').value;
        const { data, error } = await sb.auth[mode]({ email, password });
        
        if (error) return alert("Fehler: " + error.message);
        if (mode === 'signUp') {
            await sb.from('profiles').insert([{ id: data.user.id, credits: 3 }]);
            alert("Konto erstellt! Bitte einloggen.");
        } else {
            user = data.user;
            initApp();
        }
    }

    async function initApp() {
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('app-area').style.display = 'block';
        document.getElementById('user-mail').innerText = user.email;

        const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
        if (data) {
            credits = data.credits;
            document.getElementById('credit-status').innerText = "Credits: " + credits;
            if (data.firma_daten) {
                const f = data.firma_daten;
                document.getElementById('f_name').value = f.name || '';
                document.getElementById('f_str').value = f.str || '';
                document.getElementById('f_ort').value = f.ort || '';
                document.getElementById('f_iban').value = f.iban || '';
                document.getElementById('f_stnr').value = f.stnr || '';
            }
        }
        if(document.getElementById('pos-list').innerHTML === "") addPos();
    }

    async function saveFirma() {
        const fd = {
            name: document.getElementById('f_name').value,
            str: document.getElementById('f_str').value,
            ort: document.getElementById('f_ort').value,
            iban: document.getElementById('f_iban').value,
            stnr: document.getElementById('f_stnr').value
        };
        await sb.from('profiles').update({ firma_daten: fd }).eq('id', user.id);
        alert("Gespeichert!");
    }

    function addPos() {
        const d = document.createElement('div');
        d.className = 'zeile';
        d.innerHTML = `<input type="text" class="p_d" placeholder="Leistung"><input type="number" class="p_m" value="1"><select class="p_e"><option>Std</option><option>Stk</option><option>Anfahrt</option></select><input type="number" class="p_p" placeholder="€"><button onclick="this.parentElement.remove()">X</button>`;
        document.getElementById('pos-list').appendChild(d);
    }

    async function go(mode) {
        if (credits <= 0) return alert("Keine Credits mehr!");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Rechnungs-Header
        doc.setFontSize(20); doc.text("RECHNUNG", 20, 20);
        doc.setFontSize(10);
        doc.text(document.getElementById('f_name').value, 20, 30);
        doc.text(document.getElementById('f_str').value + ", " + document.getElementById('f_ort').value, 20, 35);
        
        doc.text("AN: " + document.getElementById('k_name').value, 20, 50);
        doc.text("Nr: " + document.getElementById('r_nr').value, 140, 50);

        const rows = [];
        let gesamt = 0;
        document.querySelectorAll('.zeile').forEach(z => {
            const m = z.querySelector('.p_m').value;
            const p = z.querySelector('.p_p').value;
            const s = m * p; gesamt += s;
            rows.push([z.querySelector('.p_d').value, m, z.querySelector('.p_e').value, p + " €", s.toFixed(2) + " €"]);
        });

        doc.autoTable({ startY: 60, head: [['Leistung', 'Menge', 'Einh.', 'Preis', 'Gesamt']], body: rows });
        
        const y = doc.lastAutoTable.finalY + 10;
        doc.text("GESAMTBETRAG: " + gesamt.toFixed(2) + " €", 140, y);
        doc.text("IBAN: " + document.getElementById('f_iban').value, 20, y + 20);

        if (mode === 'mail') {
            window.location.href = `mailto:?subject=Rechnung&body=Anbei die Rechnung über ${gesamt.toFixed(2)} Euro.`;
        }
        
        doc.save("Rechnung.pdf");

        // Credit abziehen (nach dem Save, falls DB hakt)
        await sb.from('profiles').update({ credits: credits - 1 }).eq('id', user.id);
        setTimeout(() => location.reload(), 1000);
    }

    // Auto-Login
    sb.auth.getSession().then(({data}) => { if(data.session) { user = data.session.user; initApp(); } });
</script>
</body>
</html>
