<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --yellow: #ffcc00; --dark: #1a1a2e; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 850px; border: 5px solid var(--dark); }
        .header-yellow { background: var(--yellow); padding: 20px; border-radius: 15px; border: 5px solid var(--dark); text-align: center; margin-bottom: 20px; }
        .section-title { font-weight: 900; text-transform: uppercase; border-left: 8px solid var(--dark); padding-left: 15px; margin: 25px 0 15px 0; font-size: 18px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { padding: 15px; border-radius: 10px; border: 3px solid #eee; font-size: 16px; width: 100%; box-sizing: border-box; background: #fafafa; font-weight: 600; }
        .zeile { display: grid; grid-template-columns: 3fr 1fr 1.5fr 1fr 0.5fr; gap: 10px; background: #f4f6ff; padding: 15px; border-radius: 15px; margin-bottom: 10px; align-items: center; border: 2px solid #e0e6ed; }
        .btn { padding: 18px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 16px; transition: 0.2s; }
        .btn-black { background: var(--dark); color: white; width: 100%; box-shadow: 0 5px 0 #333; }
        .btn-save { background: #28a745; color: white; margin-top: 15px; font-size: 12px; padding: 10px; }
        #auth-screen { display: block; text-align: center; max-width: 450px; margin-top: 50px; }
        #app-screen { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen" class="card">
        <div class="header-yellow"><h1 style="font-size:40px; margin:0;">⚡ MEISTER-BLITZ</h1></div>
        <input type="email" id="email" placeholder="E-MAIL ADRESSE" style="margin-bottom:10px;">
        <input type="password" id="pw" placeholder="PASSWORT">
        <button class="btn btn-black" onclick="auth('signInWithPassword')" style="margin-top:20px;">EINLOGGEN</button>
        <p onclick="auth('signUp')" style="margin-top:20px; cursor:pointer; font-weight:bold; text-decoration:underline;">Konto erstellen (3 Gratis-Tests)</p>
    </div>

    <div id="app-screen" class="card">
        <div class="header-yellow">
            <h2 style="margin:0;">RECHNUNGS-CENTER</h2>
            <div id="status-badge" style="background:white; display:inline-block; padding:5px 15px; border-radius:20px; margin-top:10px; font-weight:bold;">Lade...</div>
        </div>

        <div class="section-title">🏢 FIRMEN-DATEN</div>
        <div class="grid-inputs">
            <input type="text" id="f_name" placeholder="Firma">
            <input type="text" id="f_str" placeholder="Straße">
            <input type="text" id="f_ort" placeholder="PLZ / Ort">
            <input type="text" id="f_iban" placeholder="IBAN">
            <input type="text" id="f_stnr" placeholder="Steuer-Nr.">
        </div>
        <button class="btn btn-save" onclick="saveFirmendaten()">DATEN SPEICHERN</button>

        <div class="section-title">👤 KUNDE</div>
        <div class="grid-inputs">
            <input type="text" id="k_name" placeholder="Kundenname">
            <input type="text" id="k_str" placeholder="Straße">
            <input type="text" id="k_ort" placeholder="Ort">
            <input type="text" id="r_nr" value="RE-001">
            <input type="date" id="r_datum">
        </div>

        <div class="section-title">🛠️ POSITIONEN</div>
        <div id="pos-container"></div>
        <button onclick="addPos()" style="width:100%; padding:10px; border:2px dashed #ccc; cursor:pointer;">+ POSITION</button>

        <div style="margin-top:30px; display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <button class="btn btn-black" onclick="finish('download')">PDF SPEICHERN</button>
            <button class="btn btn-black" style="background:#007bff;" onclick="finish('email')">SENDEN</button>
        </div>
        <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; color:gray; cursor:pointer; width:100%;">Abmelden</button>
    </div>

<script>
    // DEINE DATEN - PRÄZISE EINGEBAUT
    const URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    
    const _supabase = supabase.createClient(URL, KEY);

    let sessionUser = null;
    let userProfile = null;

    async function auth(type) {
        const { data, error } = await _supabase.auth[type]({ email: document.getElementById('email').value, password: document.getElementById('pw').value });
        if (error) return alert("Fehler: " + error.message);
        if (data.user) {
            sessionUser = data.user;
            if (type === 'signUp') await _supabase.from('profiles').insert([{ id: data.user.id, credits: 3 }]);
            loadApp();
        }
    }

    async function loadApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('r_datum').valueAsDate = new Date();
        
        const { data, error } = await _supabase.from('profiles').select('*').eq('id', sessionUser.id).single();
        if (error) return console.log("Profil laden fehlgeschlagen");
        userProfile = data;
        
        if (data.firma_daten) {
            document.getElementById('f_name').value = data.firma_daten.name || '';
            document.getElementById('f_str').value = data.firma_daten.str || '';
            document.getElementById('f_ort').value = data.firma_daten.ort || '';
            document.getElementById('f_iban').value = data.firma_daten.iban || '';
            document.getElementById('f_stnr').value = data.firma_daten.stnr || '';
        }
        updateBadge();
        addPos();
    }

    function updateBadge() {
        const istAbo = userProfile.abo_bis && new Date(userProfile.abo_bis) > new Date();
        document.getElementById('status-badge').innerText = istAbo ? "🌟 PRO AKTIV" : "CREDITS: " + userProfile.credits;
    }

    async function saveFirmendaten() {
        const fd = {
            name: document.getElementById('f_name').value,
            str: document.getElementById('f_str').value,
            ort: document.getElementById('f_ort').value,
            iban: document.getElementById('f_iban').value,
            stnr: document.getElementById('f_stnr').value
        };
        await _supabase.from('profiles').update({ firma_daten: fd }).eq('id', sessionUser.id);
        alert("Gespeichert!");
    }

    function addPos() {
        const div = document.createElement('div');
        div.className = 'zeile';
        div.innerHTML = `
            <input type="text" class="p_desc" placeholder="Leistung">
            <input type="number" class="p_menge" value="1">
            <select class="p_einheit"><option>Std.</option><option>Stk.</option><option>Anfahrt</option><option>Material</option></select>
            <input type="number" class="p_preis" placeholder="€">
            <button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer;">❌</button>`;
        document.getElementById('pos-container').appendChild(div);
    }

    async function finish(mode) {
        const istAbo = userProfile.abo_bis && new Date(userProfile.abo_bis) > new Date();
        if (!istAbo && userProfile.credits <= 0) return alert("Bitte Guthaben aufladen!");

        if (!istAbo) await _supabase.rpc('use_credit_safe');

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.text(document.getElementById('f_name').value, 20, 25);
        doc.setFontSize(10); doc.text(document.getElementById('f_str').value + ", " + document.getElementById('f_ort').value, 20, 32);
        
        const rows = []; let gesamt = 0;
        document.querySelectorAll('.zeile').forEach(z => {
            const m = parseFloat(z.querySelector('.p_menge').value) || 0;
            const p = parseFloat(z.querySelector('.p_preis').value) || 0;
            const sum = m * p; gesamt += sum;
            rows.push([z.querySelector('.p_desc').value, m, z.querySelector('.p_einheit').value, p.toFixed(2) + " €", sum.toFixed(2) + " €"]);
        });

        doc.autoTable({ startY: 80, head: [['Leistung', 'Menge', 'Einh.', 'Preis', 'Gesamt']], body: rows });
        doc.text("GESAMT: " + gesamt.toFixed(2) + " €", 140, doc.lastAutoTable.finalY + 10);
        doc.save("Rechnung.pdf");
        
        alert("Erfolgreich!");
        location.reload();
    }
</script>
</body>
</html>
