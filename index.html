<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --yellow: #ffcc00; --dark: #111; }
        body { font-family: 'Arial Black', sans-serif; background: #eee; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; border: 8px solid var(--dark); max-width: 800px; margin: auto; }
        .header { background: var(--yellow); padding: 20px; border: 5px solid var(--dark); text-align: center; margin-bottom: 20px; }
        input, select { width: 100%; padding: 15px; margin: 5px 0; border: 3px solid var(--dark); border-radius: 10px; font-weight: bold; box-sizing: border-box; }
        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .zeile { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 0.5fr; gap: 10px; margin-top: 10px; background: #ddd; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-box" class="card">
        <div class="header"><h1>⚡ LOGIN / REGISTRIEREN</h1></div>
        <input type="email" id="email" placeholder="E-MAIL">
        <input type="password" id="pw" placeholder="PASSWORT">
        <button class="btn" onclick="handleAuth('signInWithPassword')">EINLOGGEN</button>
        <button class="btn" style="background:#555;" onclick="handleAuth('signUp')">KONTO ERSTELLEN (3 VERSUCHE GRATIS)</button>
    </div>

    <div id="app-box" class="card" style="display:none;">
        <div class="header"><h1 id="status-text">LADE...</h1></div>
        
        <h3>🏢 MEINE DATEN</h3>
        <input type="text" id="f_name" placeholder="Firmenname">
        <input type="text" id="f_iban" placeholder="IBAN">
        <button class="btn" style="background:#28a745; padding: 10px;" onclick="saveFirma()">DATEN SPEICHERN</button>

        <h3>👤 KUNDE</h3>
        <input type="text" id="k_name" placeholder="Kundenname">
        
        <h3>🛠️ POSITIONEN</h3>
        <div id="pos-container"></div>
        <button onclick="addPos()" style="margin-top:10px;">+ POS HINZUFÜGEN</button>

        <button class="btn" onclick="generate()">📥 RECHNUNG SPEICHERN (-1 CREDIT)</button>
        <button class="btn" style="background:#ff4444;" onclick="location.reload()">LOGOUT</button>
    </div>

<script>
    const URL = 'https://gemywlmdshnagfetimyy.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA';
    const _supabase = supabase.createClient(URL, KEY);

    let user = null;
    let profile = null;

    async function handleAuth(type) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pw').value;
        const { data, error } = await _supabase.auth[type]({ email: e, password: p });

        if (error) {
            if (error.message.includes("Email not confirmed")) {
                alert("BITTE BESTÄTIGE DEINE EMAIL! Schau in dein Postfach (auch Spam). Ohne Bestätigung lässt Supabase dich nicht rein.");
            } else {
                alert("FEHLER: " + error.message);
            }
            return;
        }

        if (data.user) {
            user = data.user;
            if (type === 'signUp') {
                await _supabase.from('profiles').insert([{ id: user.id, credits: 3 }]);
                alert("Konto erstellt! Bitte check deine Emails zur Bestätigung, dann log dich ein.");
            } else {
                start();
            }
        }
    }

    async function start() {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'block';
        
        const { data } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
        if (!data) {
            // Falls Profil fehlt, schnell eins erstellen
            const { data: neu } = await _supabase.from('profiles').insert([{ id: user.id, credits: 3 }]).select().single();
            profile = neu;
        } else {
            profile = data;
        }

        if (profile.firma_daten) {
            document.getElementById('f_name').value = profile.firma_daten.name || '';
            document.getElementById('f_iban').value = profile.firma_daten.iban || '';
        }
        updateUI();
        addPos();
    }

    function updateUI() {
        const istAbo = profile.abo_bis && new Date(profile.abo_bis) > new Date();
        document.getElementById('status-text').innerText = istAbo ? "🌟 ABO AKTIV" : "GUTHABEN: " + profile.credits;
    }

    async function saveFirma() {
        const d = { name: document.getElementById('f_name').value, iban: document.getElementById('f_iban').value };
        await _supabase.from('profiles').update({ firma_daten: d }).eq('id', user.id);
        alert("Gespeichert!");
    }

    function addPos() {
        const d = document.createElement('div'); d.className = 'zeile';
        d.innerHTML = `<input type="text" class="p_d" placeholder="Was?"><input type="number" class="p_m" value="1"><select><option>Std</option><option>Stk</option><option>Anfahrt</option></select><input type="number" class="p_p" placeholder="€">`;
        document.getElementById('pos-container').appendChild(d);
    }

    async function generate() {
        const istAbo = profile.abo_bis && new Date(profile.abo_bis) > new Date();
        if (!istAbo && profile.credits <= 0) return alert("KEINE CREDITS!");

        if (!istAbo) await _supabase.rpc('use_credit_safe');

        const doc = new jspdf.jsPDF();
        doc.text("RECHNUNG", 20, 20);
        doc.text("Kunde: " + document.getElementById('k_name').value, 20, 30);
        doc.save("Rechnung.pdf");
        
        alert("ERLEDIGT!");
        location.reload();
    }
</script>
</body>
</html>
