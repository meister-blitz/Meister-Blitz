<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MEISTER-BLITZ PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-blue { background: #5d5fef; color: white; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-ui">
        <h1>⚡ Meister-Blitz</h1>
        <input type="email" id="email" placeholder="Deine E-Mail">
        <input type="password" id="password" placeholder="Passwort">
        <button class="btn btn-blue" onclick="register()">Registrieren (3 Gratis-Codes)</button>
        <button class="btn" onclick="login()" style="background:#eee;">Einloggen</button>
    </div>

    <div id="app-ui" style="display:none;">
        <h1>✅ Willkommen</h1>
        <p>Verfügbare Credits: <strong id="credits-count">0</strong></p>
        <div id="payment-notice" style="display:none; color: red; font-weight: bold;">
            Guthaben leer! Bitte zahlen für mehr Codes.
        </div>
        <button class="btn btn-blue" onclick="useCode()">Einen Code verbrauchen</button>
        <button class="btn" onclick="location.reload()" style="margin-top:20px;">Abmelden</button>
    </div>
</div>

<script>
    // HIER SIND DIE KORREKTEN ZUGANGSDATEN
    const _supabase = supabase.createClient(
        'https://gemywlmdshnagfetimyy.supabase.co', 
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbXl3bG1kc2huYWdmZXRpbXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNTE5OTQsImV4cCI6MjA5MzkyNzk5NH0.jfbP6DI7XhZ0zVg4VoltIZEWOztvXZ7g_ZmhGKG7sFA'
    );

    let userSession = null;

    async function register() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        if(!e || !p) return alert("Bitte alles ausfüllen!");

        const { data, error } = await _supabase.auth.signUp({ email: e, password: p });
        
        if (error) return alert("Fehler: " + error.message);
        
        // Erstellt den Eintrag für die 3 Gratis-Credits
        if (data.user) {
            await _supabase.from('profiles').insert([{ id: data.user.id, credits: 3 }]);
            alert("Account erstellt! Du kannst dich jetzt einloggen.");
        }
    }

    async function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        const { data, error } = await _supabase.auth.signInWithPassword({ email: e, password: p });
        
        if (error) return alert("Login fehlgeschlagen: " + error.message);
        
        userSession = data.user;
        showApp();
    }

    async function showApp() {
        document.getElementById('auth-ui').style.display = 'none';
        document.getElementById('app-ui').style.display = 'block';
        updateCreditsDisplay();
    }

    async function updateCreditsDisplay() {
        const { data, error } = await _supabase.from('profiles').select('credits').eq('id', userSession.id).single();
        if (data) {
            document.getElementById('credits-count').innerText = data.credits;
            document.getElementById('payment-notice').style.display = data.credits <= 0 ? 'block' : 'none';
        }
    }

    async function useCode() {
        const { data } = await _supabase.from('profiles').select('credits').eq('id', userSession.id).single();
        
        if (data && data.credits > 0) {
            const newCredits = data.credits - 1;
            await _supabase.from('profiles').update({ credits: newCredits }).eq('id', userSession.id);
            alert("Code verbraucht! Noch " + newCredits + " übrig.");
            updateCreditsDisplay();
        } else {
            alert("Kein Guthaben mehr! Bitte lade dein Konto auf.");
        }
    }
</script>
</body>
</html>
