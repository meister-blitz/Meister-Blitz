<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ PRO | DAS ULTIMATIVE SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #5d5fef; --secondary: #28a745; --bg: #f0f4f8; --dark: #1a1a2e; --yellow: #ffcc00; --white: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; color: #333; line-height: 1.6; }
        .wrapper { width: 100%; max-width: 1000px; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* DER GELBE MEISTER-LOGIN */
        #login-screen { 
            background: var(--yellow); padding: 80px 50px; border-radius: 40px; text-align: center; 
            border: 10px solid var(--dark); box-shadow: 0 30px 60px rgba(0,0,0,0.3); margin-top: 40px;
        }
        .auth-input { width: 100%; max-width: 400px; padding: 20px; margin: 15px 0; border-radius: 15px; border: 5px solid #000; font-size: 20px; font-weight: 900; box-sizing: border-box; outline: none; }
        .btn-auth-primary { background: #000; color: #fff; padding: 20px 50px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 20px; }
        
        #main-dashboard { display: none; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--dark); color: white; padding: 20px 30px; border-radius: 20px; margin-bottom: 25px; }
        
        .card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e0e6ed; }
        .section-title { font-weight: 900; color: var(--primary); margin-bottom: 20px; border-left: 5px solid var(--primary); text-transform: uppercase; font-size: 16px; padding-left: 15px; }
        
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; background: #fafafa; font-size: 15px; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        .leistung-zeile { display: grid; grid-template-columns: 3fr 1fr 1fr 1.2fr 0.5fr; gap: 15px; margin-bottom: 12px; background: #f4f6ff; padding: 15px; border-radius: 15px; border: 1px solid #dce0ff; align-items: center; }
        
        .btn-main { display: flex; align-items: center; justify-content: center; width: 100%; padding: 22px; color: white; border: none; border-radius: 18px; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; text-decoration: none; margin-bottom: 15px; }
        .btn-pdf { background: var(--primary); box-shadow: 0 6px 0 #3e40b5; }
        .btn-pdf:active { transform: translateY(3px); box-shadow: 0 3px 0 #3e40b5; }
        
        .badge { background: #fff3cd; color: #856404; padding: 12px 25px; border-radius: 15px; font-weight: 900; border: 2px solid #ffeeba; }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="login-screen">
        <h1 style="font-size: 55px; margin: 0; letter-spacing: -3px;">⚡ MEISTER-BLITZ</h1>
        <p style="font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px;">Profi-Rechnungssystem</p>
        <input type="email" id="email" class="auth-input" placeholder="IHRE E-MAIL">
        <input type="password" id="password" class="auth-input" placeholder="PASSWORT">
        <div style="margin-top: 30px;">
            <button class="btn-auth-primary" onclick="handleLogin()">ANMELDEN</button>
            <p onclick="handleSignUp()" style="margin-top:25px; cursor:pointer; font-weight:bold; text-decoration:underline;">Neu registrieren (3 Frei-Versuche)</p>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="header-bar">
            <span>MODUS: <b id="user-display" style="color:var(--yellow);"></b></span>
            <button onclick="handleLogout()" style="background:#ff4d4d; color:white; border:none; padding:10px 20px; border-radius:12px; cursor:pointer; font-weight:bold;">LOGOUT</button>
        </div>

        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">Dashboard</h2>
            <div id="status-display" class="badge">Prüfe Zugang...</div>
        </div>

        <div class="card">
            <div class="section-title">🏢 MEINE FIRMENDATEN (Auto-Save)</div>
            <div class="grid-inputs">
                <input type="text" id="meinName" placeholder="Firmenname" oninput="saveProfile()">
                <input type="text" id="meinInhaber" placeholder="Inhaber" oninput="saveProfile()">
                <input type="text" id="meinStrasse" placeholder="Straße / Nr." oninput="saveProfile()">
                <input type="text" id="meinOrt" placeholder="PLZ / Ort" oninput="saveProfile()">
                <input type="text" id="meinIban" placeholder="IBAN" oninput="saveProfile()">
                <input type="text" id="meinSteuer" placeholder="Steuernummer" oninput="saveProfile()">
                <input type="text" id="meinTel" placeholder="Telefon" oninput="saveProfile()">
            </div>
        </div>

        <div class="card">
            <div class="section-title">👤 RECHNUNGSEMPFÄNGER</div>
            <div class="grid-inputs">
                <input type="text" id="kundeName" placeholder="Kunde / Firma">
                <input type="text" id="kundeStrasse" placeholder="Straße">
                <input type="text" id="kundeOrt" placeholder="Ort">
                <input type="email" id="kundeEmail" placeholder="Kunden-E-Mail">
            </div>
        </div>

        <div class="card">
            <div class="section-title">🛠️ POSITIONEN</div>
            <div id="leistungen-container"></div>
            <button onclick="addLeistung()" style="width:100%; padding:15px; border:3px dashed #ddd; border-radius:15px; background:none; cursor:pointer; font-weight:bold; color:#888;">+ NEUE ZEILE</button>
        </div>

        <div id="action-area" class="card" style="text-align:center; border:5px solid var(--primary); background:#f0f4ff;">
            </div>
    </div>
</div>

<script>
    const _supabase = supabase.createClient('https://gemywlmdshnagfetimyy.supabase.co', 'sb_publishable_hwjB__36LittD9mWemOeYw_Ur89dBxi');
    const STRIPE_URL = "https://buy.stripe.com/8x2fZ93URcjE3p2giv2B200";
    let currentUser, userCredits = 0, aboBis = null, rechnungsNummer = Math.floor(Math.random() * 90000) + 10000;

    window.onload = async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) { currentUser = session.user; await loadUserData(); await checkPaymentSuccess(); }
    };

    async function handleLogin() {
        const { error } = await _supabase.auth.signInWithPassword({ email: v('email'), password: v('password') });
        if (error) alert(error.message); else location.reload();
    }

    async function handleSignUp() {
        const { data, error } = await _supabase.auth.signUp({ email: v('email'), password: v('password') });
        if (error) alert(error.message); 
        else if (data.user) {
            await _supabase.from('profiles').insert({ id: data.user.id, credits: 3 });
            alert("Konto erstellt! Bitte E-Mail bestätigen.");
        }
    }

    async function handleLogout() { await _supabase.auth.signOut(); location.reload(); }

    async function loadUserData() {
        const { data: prof } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        if (prof) {
            userCredits = prof.credits;
            aboBis = prof.abo_bis;
            id('meinName').value = prof.firma_name || ''; id('meinInhaber').value = prof.firma_inhaber || '';
            id('meinStrasse').value = prof.firma_strasse || ''; id('meinOrt').value = prof.firma_ort || '';
            id('meinIban').value = prof.firma_iban || ''; id('meinSteuer').value = prof.firma_steuer || '';
            id('meinTel').value = prof.firma_tel || '';
        }
        id('login-screen').style.display = 'none'; id('main-dashboard').style.display = 'block';
        id('user-display').innerText = currentUser.email;
        refreshUI();
        addLeistung('Arbeitsleistung', 1, 'Std', 65);
    }

    async function saveProfile() {
        if (!currentUser) return;
        await _supabase.from('profiles').upsert({ 
            id: currentUser.id, firma_name: v('meinName'), firma_inhaber: v('meinInhaber'),
            firma_strasse: v('meinStrasse'), firma_ort: v('meinOrt'),
            firma_iban: v('meinIban'), firma_steuer: v('meinSteuer'),
            firma_tel: v('meinTel'), credits: userCredits, abo_bis: aboBis
        });
    }

    function refreshUI() {
        const area = id('action-area'), status = id('status-display');
        const aktiv = aboBis && new Date(aboBis) > new Date();
        
        if (aktiv) {
            status.innerText = "PRO-ABO AKTIV";
            status.style.background = "#d4edda";
            area.innerHTML = `<button class="btn-main btn-pdf" onclick="generatePDF()">📥 PDF RECHNUNG ERSTELLEN</button>`;
        } else {
            status.innerText = "GUTHABEN: " + userCredits + " FREI";
            status.style.background = "#fff3cd";
            if (userCredits > 0) {
                area.innerHTML = `<button class="btn-main btn-pdf" onclick="generatePDF()">📥 PDF ERSTELLEN (${userCredits} übrig)</button>`;
            } else {
                area.innerHTML = `
                <p style="font-weight:bold; color:red; margin-bottom:10px;">Guthaben verbraucht!</p>
                <a href="${STRIPE_URL}" class="btn-main" style="background:var(--secondary); text-decoration:none; box-shadow: 0 6px 0 #1e7e34;">🚀 JETZT 30 TAGE FREISCHALTEN (11,99 €)</a>`;
            }
        }
    }

    async function generatePDF() {
        const aktiv = aboBis && new Date(aboBis) > new Date();
        if (!aktiv) {
            if (userCredits <= 0) return alert("Abo abgelaufen!");
            userCredits--; 
            await saveProfile(); // Speichert den neuen Credit-Stand sofort in der Cloud!
        }
        refreshUI();

        const doc = new jspdf.jsPDF();
        doc.setFontSize(26); doc.setFont("helvetica", "bold"); doc.text("RECHNUNG", 20, 30);
        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text("Nr: " + rechnungsNummer + " | Datum: " + new Date().toLocaleDateString(), 130, 25);
        
        const rows = []; let netto = 0;
        document.querySelectorAll('.leistung-zeile').forEach(row => {
            const d = row.querySelector('.desc').value, m = parseFloat(row.querySelector('.menge').value) || 0,
                  p = parseFloat(row.querySelector('.preis').value) || 0;
            if(d) { rows.push([d, m, "Std", p.toFixed(2) + " €", (m*p).toFixed(2) + " €"]); netto += (m*p); }
        });

        doc.autoTable({ startY: 70, head: [['Beschreibung', 'Menge', 'Einh.', 'Einzel', 'Gesamt']], body: rows, theme: 'grid' });
        doc.text("Gesamt Brutto (19% MwSt): " + (netto * 1.19).toFixed(2) + " €", 130, doc.lastAutoTable.finalY + 15);
        doc.save(`Rechnung_${rechnungsNummer}.pdf`);
        rechnungsNummer++;
    }

    function addLeistung(d='', m=1, e='Std', p=0) {
        const div = document.createElement('div');
        div.className = 'leistung-zeile';
        div.innerHTML = `<input type="text" class="desc" value="${d}"><input type="number" class="menge" value="${m}"><select><option>Std</option></select><input type="number" class="preis" value="${p}"><button onclick="this.parentElement.remove()" style="background:none; border:none; font-size:20px; cursor:pointer;">🗑️</button>`;
        id('leistungen-container').appendChild(div);
    }

    function id(i) { return document.getElementById(i); }
    function v(i) { return id(i).value; }
    async function checkPaymentSuccess() {
        if (new URLSearchParams(window.location.search).get('payment') === 'success') {
            let d = new Date(); d.setDate(d.getDate() + 30); aboBis = d.toISOString();
            userCredits = 0; await saveProfile(); window.history.replaceState({}, '', '/'); refreshUI();
        }
    }
</script>
</body>
</html>
