<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEISTER-BLITZ v4.0 | PRO-SYSTEM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #5d5fef; --secondary: #28a745; --bg: #f0f4f8; --dark: #1a1a2e; --yellow: #ffcc00; --white: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h1 { color: var(--dark); text-align: center; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-box, .rechnungs-box { display: none; }
        .active { display: block; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--dark); }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: var(--secondary); }
        .btn-yellow { background: var(--yellow); color: var(--dark); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .leistung-zeile { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: center; }
        .credits-badge { background: var(--yellow); padding: 5px 15px; border-radius: 20px; font-weight: bold; float: right; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #777; }
        @media (max-width: 600px) { .leistung-zeile { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ MEISTER-BLITZ <span style="font-size: 0.5em; background: var(--dark); color: white; padding: 2px 8px; border-radius: 5px;">PRO</span></h1>
    
    <div id="auth-section" class="auth-box active">
        <p style="text-align: center; color: #666;">Handwerker-Abrechnung in 60 Sekunden.</p>
        <div class="input-group">
            <label>E-Mail</label>
            <input type="email" id="email" placeholder="Deine E-Mail">
        </div>
        <div class="input-group">
            <label>Passwort</label>
            <input type="password" id="password" placeholder="Passwort">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Einloggen</button>
        <button class="btn btn-secondary" onclick="handleSignUp()">Registrieren (3 Frei-Versuche)</button>
    </div>

    <div id="app-section" class="rechnungs-box">
        <div class="credits-badge">Credits: <span id="user-credits">0</span></div>
        <button onclick="handleLogout()" style="margin-bottom: 20px; background: none; border: none; color: blue; cursor: pointer;">Abmelden</button>
        
        <div style="border-bottom: 2px solid var(--bg); margin-bottom: 20px; padding-bottom: 10px;">
            <h3>1. Deine Firmendaten</h3>
            <div class="input-group"><input type="text" id="firmaName" placeholder="Dein Firmenname"></div>
            <div class="input-group"><input type="text" id="firmaAnschrift" placeholder="Straße, PLZ Ort"></div>
            <div class="input-group"><input type="text" id="firmaMail" placeholder="Deine E-Mail für Kopie"></div>
        </div>

        <div style="border-bottom: 2px solid var(--bg); margin-bottom: 20px; padding-bottom: 10px;">
            <h3>2. Empfänger</h3>
            <div class="input-group"><input type="text" id="kundeName" placeholder="Name des Kunden"></div>
            <div class="input-group"><input type="text" id="kundeAnschrift" placeholder="Anschrift des Kunden"></div>
            <div class="input-group"><input type="email" id="kundeEmail" placeholder="E-Mail des Kunden (für Direktversand)"></div>
        </div>

        <div style="border-bottom: 2px solid var(--bg); margin-bottom: 20px; padding-bottom: 10px;">
            <h3>3. Leistungen</h3>
            <div id="leistungen-container"></div>
            <button class="btn btn-yellow" onclick="addLeistung()" style="padding: 10px; margin-top: 5px;">+ Position hinzufügen</button>
            
            <datalist id="leistungs-liste">
                <option value="Arbeitsstunden">
                <option value="Anfahrtspauschale">
                <option value="Materialkosten laut Beleg">
                <option value="Kleinmaterial & Reinigung">
                <option value="Maschinenmiete">
            </datalist>
        </div>

        <div class="input-group">
            <label>Rechnungsnummer (automatisch)</label>
            <input type="text" id="rechnungsNummer" readonly>
        </div>

        <button class="btn btn-primary" onclick="generatePDF(false)">PDF Vorschau</button>
        <button class="btn btn-secondary" onclick="generatePDF(true)">Final Senden & -1 Credit</button>
        
        <p style="font-size: 12px; color: red; margin-top: 10px; text-align: center;">Hinweis: Senden zieht 1 Credit ab. Vorschau ist kostenlos.</p>
    </div>

    <div class="footer">
        © 2024 MEISTER-BLITZ | High-Speed-Invoicing für Profis
    </div>
</div>

<script>
    // Supabase Konfiguration
    const _supabase = supabase.createClient('https://jifbshvofzsqiuvitpgm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppZmJzaHZvZnpzcWl1dml0cGdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzIxNTcxMTQsImV4cCI6MjA0NzczMzExNH0.vG9-C7-fMOf-S3k-6jG15W9V6T9Y2z3G8p2Y4U7E5c8');

    // Hilfsfunktionen
    const id = (i) => document.getElementById(i);
    const v = (i) => id(i).value;

    // AUTH FUNKTIONEN
    async function handleSignUp() {
        const email = v('email');
        const password = v('password');
        
        if (!email || password.length < 6) {
            alert("Bitte E-Mail eingeben und ein Passwort mit mind. 6 Zeichen!");
            return;
        }

        // 1. User bei Supabase anmelden
        const { data, error } = await _supabase.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            alert("Registrierung fehlgeschlagen: " + error.message);
            return;
        }

        if (data.user) {
            // 2. Profil in der Datenbank erstellen (WICHTIG: RLS Policy muss auf TRUE stehen)
            const { error: profileError } = await _supabase
                .from('profiles')
                .insert([{ id: data.user.id, credits: 3 }]);

            if (profileError) {
                console.error("DB Fehler beim Profil:", profileError);
                alert("Account erstellt! Bitte logge dich jetzt ein.");
            } else {
                alert("Willkommen! Dein Account ist bereit mit 3 Gratis-Credits.");
            }
            location.reload();
        }
    }

    async function handleLogin() {
        const { data, error } = await _supabase.auth.signInWithPassword({ email: v('email'), password: v('password') });
        if (error) alert("Login fehlgeschlagen: " + error.message);
        else checkSession();
    }

    async function handleLogout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    async function checkSession() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            id('auth-section').classList.remove('active');
            id('app-section').classList.add('active');
            loadProfile(session.user.id);
            id('rechnungsNummer').value = 'RE-' + Math.floor(Math.random() * 90000 + 10000);
            addLeistung('Arbeitszeit', 1, 'Std', 65); // Standard-Vorschlag
        }
    }

    async function loadProfile(uid) {
        const { data } = await _supabase.from('profiles').select('*').eq('id', uid).single();
        if (data) id('user-credits').innerText = data.credits;
    }

    // PDF GENERIERUNG
    async function generatePDF(isEmail) {
        const { data: { session } } = await _supabase.auth.getSession();
        const { data: profile } = await _supabase.from('profiles').select('credits').eq('id', session.user.id).single();

        if (isEmail && profile.credits <= 0) {
            alert("Keine Credits mehr! Bitte lade dein Konto auf.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const fName = v('firmaName'), fAnschrift = v('firmaAnschrift'), rechnungsNummer = v('rechnungsNummer');
        
        // Header
        doc.setFontSize(22); doc.setTextColor(93, 95, 239); doc.text(fName, 20, 30);
        doc.setFontSize(10); doc.setTextColor(100); doc.text(fAnschrift, 20, 38);
        doc.setDrawColor(93, 95, 239); doc.line(20, 42, 190, 42);

        // Kunde & Meta
        doc.setTextColor(0); doc.setFontSize(12); doc.text("Rechnung an:", 20, 55);
        doc.setFontSize(10); doc.text(v('kundeName'), 20, 62); doc.text(v('kundeAnschrift'), 20, 67);
        doc.text(`Rechnungsnr: ${rechnungsNummer}`, 140, 62); doc.text(`Datum: ${new Date().toLocaleDateString()}`, 140, 67);

        // Leistungen sammeln
        const rows = []; let gesamt = 0;
        document.querySelectorAll('.leistung-zeile').forEach(z => {
            const d = z.querySelector('.desc').value, m = z.querySelector('.menge').value, e = z.querySelector('.einheit').value, p = z.querySelector('.preis').value;
            const sum = parseFloat(m) * parseFloat(p); gesamt += sum;
            rows.push([d, m, e, p + " €", sum.toFixed(2) + " €"]);
        });

        doc.autoTable({
            startY: 80, head: [['Leistung', 'Menge', 'Einh.', 'Einzel', 'Gesamt']], body: rows,
            headStyles: { fillColor: [93, 95, 239] }, styles: { fontSize: 9 }
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.text(`Gesamtbetrag: ${gesamt.toFixed(2)} €`, 140, finalY);
        doc.setFontSize(8); doc.setFont("helvetica", "normal"); doc.text("Zahlbar innerhalb von 7 Tagen ohne Abzug.", 20, finalY + 15);

        if (isEmail) {
            // Credit abziehen
            await _supabase.from('profiles').update({ credits: profile.credits - 1 }).eq('id', session.user.id);
            loadProfile(session.user.id);

            const sub = encodeURIComponent("Rechnung " + rechnungsNummer), body = encodeURIComponent("Sehr geehrte Damen und Herren,\n\nanbei erhalten Sie die Rechnung " + rechnungsNummer + ".\n\nMit freundlichen Grüßen\n" + fName);
            window.location.href = `mailto:${v('kundeEmail')}?subject=${sub}&body=${body}`;
        }
        
        doc.save(`Rechnung_${rechnungsNummer}.pdf`);
    }

    function addLeistung(d='', m=1, e='Std', p=0) {
        const div = document.createElement('div');
        div.className = 'leistung-zeile';
        div.innerHTML = `
            <input type="text" class="desc" list="leistungs-liste" value="${d}" placeholder="Schreiben oder wählen...">
            <input type="number" class="menge" value="${m}">
            <select class="einheit">
                <option value="Std" ${e=='Std'?'selected':''}>Std</option>
                <option value="Pausch." ${e=='Pausch.'?'selected':''}>Pausch.</option>
                <option value="Stk" ${e=='Stk'?'selected':''}>Stk</option>
                <option value="m" ${e=='m'?'selected':''}>m</option>
                <option value="m²" ${e=='m²'?'selected':''}>m²</option>
            </select>
            <input type="number" class="preis" value="${p}">
            <button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer; font-size:20px;">🗑️</button>`;
        id('leistungen-container').appendChild(div);
    }

    checkSession();
</script>

</body>
</html>
